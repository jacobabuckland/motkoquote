name: Factory — Engineer Agent

on:
  issues:
    types: [labeled]
  # Re-entrant by dispatch. The reconciler re-fires a stalled stage by
  # dispatching this workflow with the item's number, NOT by toggling its label:
  # re-applying a label an issue already carries fires the `labeled` event for
  # nobody, which is precisely the defect — an item whose consumer died looks
  # identical to one being worked on, and no amount of re-labelling wakes it.
  #
  # A dispatched run does exactly what a labelled one does. The two triggers
  # differ only in where the issue number and stage come from, which is why
  # every reference below reads `github.event.issue.number || inputs.issue`.
  workflow_dispatch:
    inputs:
      issue:
        description: "Factory issue number"
        required: true
      stage:
        description: "Stage this run acts on"
        required: true
        type: choice
        options:
          - spec-derived
          - qa-changes
      reason:
        description: "Why this run was dispatched"
        required: false

# The issue number is stamped into the run name, and this is load-bearing: it is
# how the reconciler tells whether a stage is legitimately running before it
# considers re-firing one. Matching on the head branch cannot do that job — a run
# triggered by `issues.labeled` reports `head_branch: main`, so no label-triggered
# stage would ever look busy, and the PM stage has no branch to match at all until
# it pushes. GitHub evaluates `run-name` when the run is QUEUED, so the item is
# identifiable from before its first step.
run-name: Engineer [factory#${{ github.event.issue.number || inputs.issue }}] ${{ github.event.label.name || inputs.stage }}

concurrency:
  group: factory-${{ github.workflow }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      ((github.event.label.name || inputs.stage) == 'spec-derived' ||
       (github.event.label.name || inputs.stage) == 'qa-changes') &&
      !contains(github.event.issue.labels.*.name, 'factory-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # A dispatched run has not passed through the label guard on the job, so
      # the item's eligibility is established here instead. Without this, the
      # `!contains(github.event.issue.labels.*.name, 'factory-meta')` condition
      # above is vacuously true on a dispatch — `github.event.issue` is null, so
      # the label list is empty and nothing is excluded.
      - name: Validate the dispatched item
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be a number, got '$ISSUE'."; exit 1 ;;
          esac
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::#$ISSUE is $STATE. Refusing to run a stage against a closed item."
            exit 1
          fi
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
          case ",$LABELS," in
            *,factory,*) ;;
            *) echo "::error::#$ISSUE does not carry the 'factory' label."; exit 1 ;;
          esac
          case ",$LABELS," in
            *,factory-meta,*) echo "::error::#$ISSUE is a factory-meta bookkeeping issue."; exit 1 ;;
          esac
          echo "Dispatched run for #$ISSUE accepted. Reason: ${REASON:-none given}"
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_TOKEN }}
          ref: factory/${{ github.event.issue.number || inputs.issue }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The composer lives on main, but this job checks out factory/N — and a
      # factory branch cut before this landed does not contain it. Materialised
      # from origin/main so every branch, however old, composes its decision
      # section from the same source the digest parses.
      - name: Materialise the decision-section composer
        run: |
          # NOT --depth=1: a shallow fetch of main truncates its history and
          # destroys the merge base, so every later `git diff origin/main...HEAD`
          # dies with "no merge base". QA's empty-branch check did exactly that
          # on #160 and reported it as "contains only spec and tests".
          git fetch origin main --quiet
          git show origin/main:scripts/factory/decision-section.sh > /tmp/decision-section.sh
          chmod +x /tmp/decision-section.sh
          # Same reasoning for the evidence composer: a blocking comment must be
          # able to quote the run it is about, and a branch cut before this
          # landed does not carry the script that does it.
          git show origin/main:scripts/factory/failure-evidence.sh > /tmp/failure-evidence.sh
          chmod +x /tmp/failure-evidence.sh
          # And the attributor, which decides whether a frozen file is actually
          # the failure or merely mentioned in the log.
          #
          # Tolerated if absent, unlike the two above. The step runs under
          # `bash -e`, so a `git show` for a path main does not have would abort
          # it and block the item — turning a renamed helper into a factory-wide
          # outage. Every use site already guards on `-x`, and the report without
          # attribution says so plainly rather than guessing.
          git show origin/main:scripts/factory/attribute-failure.sh > /tmp/attribute-failure.sh 2>/dev/null \
            && chmod +x /tmp/attribute-failure.sh \
            || echo "::warning::attribute-failure.sh is not on main; this run will report failures without attribution."

      - name: Refuse to implement without a spec
        run: |
          if [ ! -f "docs/specs/${{ github.event.issue.number || inputs.issue }}.md" ]; then
            echo "::error::No spec file. Stale trigger - nothing to implement."
            exit 1
          fi
          # Either extension, matching the PM's contract. A component
          # acceptance test has to be .tsx because JSX does not compile in a
          # .ts file, so checking only for .test.ts refused every UI item the
          # moment the PM started writing them correctly: #118, #127, #132,
          # #133 and #95 all reached spec-derived with a valid .tsx spec and
          # were then rejected here as having no tests at all.
          ISSUE="${{ github.event.issue.number || inputs.issue }}"
          if [ ! -f "tests/acceptance/$ISSUE.test.ts" ] \
             && [ ! -f "tests/acceptance/$ISSUE.test.tsx" ]; then
            echo "::error::No acceptance tests found at tests/acceptance/$ISSUE.test.ts or .tsx."
            ls -1 tests/acceptance/ 2>/dev/null || true
            exit 1
          fi
          echo "Spec and acceptance tests present."

      # The spec is protected on exactly the same terms as the acceptance
      # tests, and for the same reason. Both are the contract the Engineer is
      # judged against, and an implementation that can rewrite its own contract
      # can make any fidelity finding disappear — on #97's rework the Engineer
      # edited docs/specs/97.md, legitimately (QA asked it to) and with nothing
      # at all standing in the way of doing it illegitimately.
      - name: Record spec and acceptance test fingerprints
        run: |
          find tests/acceptance docs/specs -type f -exec sha256sum {} \; | sort > /tmp/protected-before.txt
          cat /tmp/protected-before.txt
          chmod -R a-w tests/acceptance docs/specs

      # The branch tip as it stood before the agent ran. The agent can commit
      # and push on its own — actions/checkout leaves credentials on the remote
      # — and on #108 it did exactly that, finishing the rework, committing it
      # and pushing it. The push step then looked at a clean working tree, read
      # it as "produced no changes", and marked a finished, CI-green item
      # blocked. Whether work happened is a question about the branch, not
      # about the working tree.
      - name: Record the branch tip before the agent runs
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Branch tip before the agent: $(git rev-parse HEAD)"

      - name: Gather QA feedback if this is a rework cycle
        id: feedback
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          LABEL: ${{ github.event.label.name || inputs.stage }}
        run: |
          if [ "$LABEL" = "qa-changes" ]; then
            gh issue view "$ISSUE" \
              --comments --json comments \
              --jq '[.comments[] | select(.body | startswith("**QA findings**"))] | last | .body' \
              > /tmp/qa-feedback.txt
          else
            echo "None — first implementation pass." > /tmp/qa-feedback.txt
          fi
          {
            echo "text<<FEEDBACK_EOF"
            cat /tmp/qa-feedback.txt
            echo "FEEDBACK_EOF"
          } >> "$GITHUB_OUTPUT"

      # The two triggers are two different jobs of work and they need two
      # different instructions. "Make the acceptance tests pass" is right for
      # the first pass and actively wrong on a rework: by then the tests are
      # usually already green, because QA's findings are the things no test
      # covers — statement ordering, scope, undeclared files, spec fidelity.
      # Given that instruction on a rework the Engineer reads the findings,
      # sees green tests, correctly concludes there is nothing to do, and
      # exits with no changes — which the push step reads as a malfunction and
      # marks blocked. That is #97.
      - name: Compose the task for this trigger
        id: task
        env:
          LABEL: ${{ github.event.label.name || inputs.stage }}
        run: |
          if [ "$LABEL" = "qa-changes" ]; then
            cat > /tmp/task.txt <<'TASK'
          This is a REWORK cycle. Your implementation is already on the branch
          and QA has reviewed it — the findings above are what it raised.

          Your task: address every one of those findings, keeping the acceptance
          tests and the full suite green.

          Do not conclude there is nothing to do because the tests pass. They
          almost certainly do pass already: QA is a second opinion on what tests
          cannot see — statement ordering, files touched outside the declared
          list, spec fidelity, error handling, scope. Work through the findings
          one at a time and make the change each one calls for.

          If you genuinely believe a specific finding is mistaken, say so — do
          not express disagreement by doing nothing, because silence is
          indistinguishable from failure and gets the item marked blocked.
          Write your rebuttal to /tmp/engineer-dispute.md, naming each finding
          you dispute and giving the concrete evidence that it is wrong: the
          file and line that contradicts it, or the command you ran and its
          output. That file is posted to the issue for a human to adjudicate.

          Disputing is for findings that are factually wrong, not for findings
          you would rather not act on. Acting on the finding is the default. If
          some findings are right and others wrong, do both: fix the ones that
          are right, and write up only the ones you dispute.

          Sometimes QA is right that something is wrong, and the thing that is
          wrong is the SPEC. You may not fix that yourself — docs/specs/ is
          read-only to you. Report it instead: put a line reading exactly

              SPEC ERROR: <one line on what the spec gets wrong>

          at the top of /tmp/engineer-dispute.md, with the evidence below it.
          Any work you have already done is still committed and pushed, but the
          item then stops for a human rather than carrying on against a
          contract you and QA both believe is wrong. Use this for a spec that
          is factually wrong or self-contradictory, not for a spec you would
          have written differently.
          TASK
          else
            cat > /tmp/task.txt <<'TASK'
          Your task: make the acceptance tests pass without modifying them.
          TASK
          fi
          cat /tmp/task.txt
          {
            echo "text<<TASK_EOF"
            cat /tmp/task.txt
            echo "TASK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Implement
        id: implement
        # Deliberately non-fatal here. When this step fails the job stops, and
        # everything after it — including the push — is skipped, so a run that
        # did the work and then tripped the turn cap loses all of it (PAY-5,
        # 117 turns, whole branch discarded). Letting it continue means the
        # push below commits whatever exists; the failure is re-raised
        # immediately afterwards, so nothing is swallowed, only reordered.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-5
            # 200, not 80. PAY-5 finished its whole deletion in 117 turns and
            # was failed afterwards for exceeding the cap — a successful result
            # discarded because it took too long to succeed, not because it
            # looped. The cap is a runaway guard; it should sit above the
            # largest legitimate item, not inside it.
            --max-turns 200
            --allowedTools Read,Write,Edit,Bash,Glob,Grep
          prompt: |
            You are the Engineer Agent in the motko software factory.
            Read AGENTS.md in the repository root first and follow it exactly.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number || inputs.issue }}

            The approved spec is at docs/specs/${{ github.event.issue.number || inputs.issue }}.md.
            The acceptance tests are at tests/acceptance/${{ github.event.issue.number || inputs.issue }}.test.ts.

            QA FEEDBACK FROM THE PREVIOUS CYCLE (if any):
            ---
            ${{ steps.feedback.outputs.text }}
            ---

            ${{ steps.task.outputs.text }}

            Hard rules (these apply on every cycle, rework included):
            - You may NOT modify anything under tests/acceptance/. This is
              enforced by CI and any change there fails the build. If an
              acceptance test appears wrong, stop and say so — do not work
              around it.
            - You may NOT modify anything under docs/specs/ either, for the
              same reason: the spec is the contract you are judged against, and
              an implementation that can rewrite its own contract can make any
              fidelity finding disappear. It is read-only on disk during this
              run and enforced independently by CI. If the spec is wrong, say
              so — on a rework cycle use the SPEC ERROR route described above;
              on a first pass, stop and write a blocker.
            - Stay inside the file list declared in the spec. If you need a file
              outside it, stop and explain why.
            - The full existing suite must stay green: npm test
            - npm run typecheck, npm run lint and npm run build must all pass.
            - No new dependencies without justification.
            - No secrets, no production credentials, no destructive migrations.
            - Never weaken or skip a test to make CI pass.

            If you cannot complete the task, stop and write a clear account of
            what is blocking you. A well-described blocker is far more valuable
            than a hack.

      - name: Verify the spec and acceptance tests were not modified
        run: |
          find tests/acceptance docs/specs -type f -exec sha256sum {} \; | sort > /tmp/protected-after.txt
          if ! diff -q /tmp/protected-before.txt /tmp/protected-after.txt > /dev/null; then
            echo "::error::Engineer modified the spec or the acceptance tests. Neither is writable by the Engineer: they are the contract this work is judged against."
            diff /tmp/protected-before.txt /tmp/protected-after.txt || true
            exit 1
          fi
          echo "Spec and acceptance tests unchanged."

      - name: Restore write access
        if: always()
        run: chmod -R u+w tests/acceptance docs/specs

      # Three outcomes, not two. "Produced no changes" used to mean exactly one
      # thing — malfunction — so an Engineer that had read the findings and
      # concluded one was wrong was indistinguishable from one that fell over.
      # QA is a second opinion and second opinions are sometimes wrong (it has
      # reported blocking compile errors that did not exist), so a QA false
      # positive must not be able to hold a correct implementation blocked
      # forever. A written, evidenced rebuttal is therefore its own outcome:
      # qa-disputed, which stops the line for a human rather than either
      # advancing past review or blaming the Engineer. It is deliberately NOT
      # available on the first pass, and NOT available without a rebuttal to
      # read — otherwise it degrades into an escape hatch from doing the work.
      - name: Push implementation
        id: push
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          LABEL: ${{ github.event.label.name || inputs.stage }}
          BEFORE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ]; then
            echo "::error::No baseline commit was recorded before the agent ran, so whether it did any work cannot be answered. Refusing to guess."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.name "motko-factory"
          git config user.email "factory@motko.local"
          git add -A

          DISPUTE=""
          SPEC_ERROR=0
          if [ "$LABEL" = "qa-changes" ] && [ -s /tmp/engineer-dispute.md ]; then
            DISPUTE=/tmp/engineer-dispute.md
            HEADER="**Engineer disputes QA findings**"
            # The spec is read-only to the Engineer, so the one way it can act
            # on "the spec itself is wrong" is to say so in this file.
            if grep -qE '^SPEC ERROR:' "$DISPUTE"; then
              SPEC_ERROR=1
              HEADER="**Engineer reports an error in the spec**"
            fi
            {
              echo "$HEADER"
              echo
              cat "$DISPUTE"
            } > /tmp/dispute-comment.md
            gh issue comment "$ISSUE" --body-file /tmp/dispute-comment.md
          fi

          # Work can arrive two ways: edits left in the working tree for this
          # step to commit, or commits the agent made itself. Counting only the
          # first is what blocked #108.
          STAGED=0
          if ! git diff --cached --quiet; then STAGED=1; fi
          if [ "$STAGED" = "1" ]; then
            if [ "$LABEL" = "qa-changes" ]; then
              git commit -q -m "fix: address QA findings on #$ISSUE"
            else
              git commit -q -m "feat: implement #$ISSUE"
            fi
          fi
          AFTER=$(git rev-parse HEAD)

          if [ "$STAGED" = "0" ] && [ "$AFTER" = "$BEFORE_SHA" ]; then
            if [ -n "$DISPUTE" ]; then
              if [ "$SPEC_ERROR" = "1" ]; then
                gh issue comment "$ISSUE" \
                  --body "Engineer agent made no changes and reports that the spec is wrong, with reasons in the comment above. It cannot correct the spec itself — \`docs/specs/\` is read-only to the Engineer, so that an implementation cannot make a spec-fidelity finding disappear by rewriting what it is judged against. Resolving this means changing the contract, not the code: amend the spec into the PM's original commit (the immutability check permits only the branch's first commit to touch \`docs/specs/\`), or sharpen the Notion item and re-derive. Then re-apply \`qa-changes\` to resume."
              else
                gh issue comment "$ISSUE" \
                  --body "Engineer agent made no changes and disputes the findings, with reasons in the comment above. This is neither blocked (nothing malfunctioned) nor ready to advance (nothing was re-reviewed), so it needs a human to adjudicate: if QA was right, re-apply \`qa-changes\` with the finding restated; if the Engineer was right, re-apply \`verify\` to have QA look again."
              fi

              # A dispute is a question by definition, so it must arrive as one.
              # The agent wrote its reasoning to the dispute file; if it did not
              # frame a decision there, this composes the generic form rather
              # than leaving a human to derive the question from an argument.
              if grep -q '^## DECISION NEEDED' "$DISPUTE"; then
                sed -n '/^## DECISION NEEDED/,$p' "$DISPUTE" > /tmp/eng-decision.md
              else
                if [ "$SPEC_ERROR" = "1" ]; then
                  /tmp/decision-section.sh "$ISSUE" none \
                    "The Engineer says the spec itself is wrong — is it?" \
                    "(a) the spec is wrong: amend it into the PM's first commit, then resume at qa-changes (b) the spec is right: restate the finding and resume at qa-changes (c) re-derive the item from a sharpened Notion card" \
                    "Read the Engineer's evidence above. It has no incentive to invent a spec error, but it also cannot see the item behind the spec — check the Notion card before accepting (a)." \
                      "\`docs/specs/\` is read-only to the Engineer by construction, so that an implementation cannot retire a spec-fidelity finding by rewriting what it is measured against. Correcting the spec is a human action — which is why this stopped here rather than going round again." > /tmp/eng-decision.md
                else
                  /tmp/decision-section.sh "$ISSUE" none \
                    "QA raised a finding and the Engineer disputes it — who is right?" \
                    "(a) QA was right: resume at qa-changes with the finding restated (b) the Engineer was right: resume at verify so QA looks again" \
                    "Read the rebuttal above. A dispute that cites a file and line is usually right; one that argues from intent usually is not." \
                      "The Engineer may not edit \`docs/specs/\` or \`tests/acceptance/\`. If the disagreement is really about what the contract says rather than what the code does, no option above reaches it and the contract has to be corrected by hand." > /tmp/eng-decision.md
                fi
              fi
              gh issue comment "$ISSUE" --body-file /tmp/eng-decision.md

              # Two different stopped states, deliberately.
              #
              # `qa-disputed` is the Engineer saying QA read the code wrong.
              # `spec-dispute` is the Engineer saying the CONTRACT is wrong, and
              # it is the highest-signal output this factory produces: four for
              # four correct in the 16-17 August review, every one with a
              # reproduction. Under one shared label it queued behind ordinary
              # runner noise. It now gets its own, and the digest leads with it.
              if [ "$SPEC_ERROR" = "1" ]; then
                DISPUTE_LABEL=spec-dispute
              else
                DISPUTE_LABEL=qa-disputed
              fi
              gh issue edit "$ISSUE" --add-label "$DISPUTE_LABEL" --remove-label "$LABEL"
              echo "outcome=disputed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "Engineer agent produced no changes. Marking blocked."
              /tmp/decision-section.sh "$ISSUE" verify \
                "Did the Engineer find nothing to do because the work is already complete, or because it malfunctioned?" \
                "(a) the work is complete — resume at verify to send it to QA (b) it malfunctioned — resume at spec-derived to run it again" \
                "(a) if the acceptance tests pass on the branch: an Engineer re-run on finished work produces no changes and blocks again, which is this exact message a second time. Run the tests before choosing (b)." \
                  "unknown"
            } > /tmp/eng-nochanges.md
            gh issue comment "$ISSUE" --body-file /tmp/eng-nochanges.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label "$LABEL"
            touch /tmp/factory-handled
            exit 1
          fi

          # An agent that commits for itself is still bound by the contract.
          # The fingerprint check compares the working tree, which cannot see a
          # protected file that was changed, committed, and then restored on
          # disk; this reads the commits themselves.
          # Every commit in the range, not the endpoints: a file changed in one
          # commit and restored in the next nets to nothing between the tips
          # while still having been rewritten on the way. Same walk the CI
          # immutability jobs do.
          OFFENDING=$(for SHA in $(git rev-list "$BEFORE_SHA".."$AFTER"); do
                        git diff-tree --no-commit-id --name-only -r "$SHA"
                      done | grep -E '^(docs/specs/|tests/acceptance/)' | sort -u || true)
          if [ -n "$OFFENDING" ]; then
            echo "::error::Commits made during this run touch the spec or the acceptance tests. Neither is writable by the Engineer."
            echo "$OFFENDING"
            gh issue comment "$ISSUE" \
              --body "Engineer agent committed changes to files it may not write:

          \`\`\`
          $OFFENDING
          \`\`\`

          The spec and the acceptance tests are the contract this work is judged against, and the Engineer does not get to edit them — see the SPEC ERROR route for a spec that is genuinely wrong. Marking blocked."
            /tmp/decision-section.sh "$ISSUE" spec-derived \
              "The Engineer edited the contract it is judged against — was it reaching for a real defect in the spec or tests, or working around its own implementation?" \
              "(a) the contract is fine: resume at spec-derived; the edit is discarded with the branch reset (b) the contract is genuinely wrong: correct it in the branch's first commit, then resume" \
              "Look at what it changed above. An edit to an assertion's expected value is usually (b); an edit that deletes or weakens a test is usually (a)." \
                "\`tests/acceptance/\` and \`docs/specs/\` are frozen after the PM's first commit, so amending either is a human action. That is precisely what the Engineer was reaching for when it edited them — the edit is refused, not the intent." > /tmp/eng-protected.md
            gh issue comment "$ISSUE" --body-file /tmp/eng-protected.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label "$LABEL"
            touch /tmp/factory-handled
            exit 1
          fi

          # Unconditional: a no-op when the agent already pushed, and the thing
          # that saves the work when it committed without pushing.
          #
          # A rejection here is reported as itself, never as "the Engineer
          # produced no changes". #170 and #195 both had complete, tested
          # implementations refused by the remote:
          #
          #   ! [remote rejected] factory/170 -> factory/170 (refusing to allow
          #     a Personal Access Token to create or update workflow
          #     `.github/workflows/factory-pm.yml` without `workflow` scope)
          #
          # The step exited non-zero, the catch-all inferred "no changes", and
          # two retries followed on a diagnosis that was never true. A push that
          # fails has an error; printing it is the whole fix.
          if ! git push origin "factory/$ISSUE" > /tmp/push.log 2>&1; then
            cat /tmp/push.log

            if grep -q "without \`workflow\` scope" /tmp/push.log; then
              Q="The push was refused because FACTORY_TOKEN lacks the \`workflow\` scope, and this item changes a file under .github/workflows/ — do you want the token to be able to do that?"
              O="(a) regenerate FACTORY_TOKEN with \`workflow\` scope added, then resume at \`spec-derived\` (b) re-scope the item so it does not touch .github/workflows/"
              R="(a) if the factory is meant to modify its own workflows, which items like anchoring and the post-deploy health check require. The implementation is reproducible — it is refused at the remote, not missing, so no work is lost by resuming once the token can push it."
              P="Yes, and it is the whole of this failure: no agent can widen its own token scope. The implementation is complete and the remote refused it, so option (a) is a human action and option (b) is a change to the item."
            else
              Q="The push to \`factory/$ISSUE\` was rejected by the remote — why?"
              O="(a) read the rejection above and clear whatever it names, then resume at \`spec-derived\` (b) if the branch diverged, reconcile it by hand first"
              R="Read the rejection text before retrying. A rejected push is not a failed implementation: the work existed and the remote refused it, so re-running the agent reproduces the same rejection."
              P="unknown — the rejection text above has not been matched to a known cause, so whether clearing it is inside any agent's reach is not established here."
            fi

            {
              echo "**The implementation was complete, but the push was rejected.** This is not a failed agent run — the work was done and the remote refused it."
              echo
              echo '```'
              tail -12 /tmp/push.log
              echo '```'
              if [ -x /tmp/decision-section.sh ]; then
                /tmp/decision-section.sh "$ISSUE" spec-derived "$Q" "$O" "$R" "$P"
              fi
            } > /tmp/push-rejected.md

            gh issue comment "$ISSUE" --body-file /tmp/push-rejected.md || true
            gh issue edit "$ISSUE" --add-label blocked --remove-label "$LABEL" || true
            touch /tmp/factory-handled
            echo "::error::Push to factory/$ISSUE rejected — see the comment on the issue."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          # Work done and pushed, but the line still stops: QA judges spec
          # fidelity and the human reads the spec at review time, so sending
          # this to verify would have QA re-review against a contract both
          # agents believe is wrong, re-raise the same finding, and spend one
          # of the three cycles doing it.
          if [ "$SPEC_ERROR" = "1" ]; then
            gh issue comment "$ISSUE" \
              --body "**Spec error reported — the work is pushed, but this is not advancing to QA.** The Engineer's changes are committed on \`factory/$ISSUE\`; the reasoning is in the comment above. Nothing further should be reviewed against a spec both agents now believe is wrong, so this needs the contract fixed first: amend the spec into the PM's original commit (the immutability check permits only the branch's first commit to touch \`docs/specs/\`), or sharpen the Notion item and re-derive. Then re-apply \`qa-changes\`, or \`verify\` if the pushed work is complete."
            gh issue edit "$ISSUE" --add-label spec-dispute --remove-label "$LABEL"
            echo "outcome=disputed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=pushed" >> "$GITHUB_OUTPUT"

      # Re-raise the agent failure now that the work is safely committed. The
      # Implement step is continue-on-error purely so the push above can run;
      # without this the job would go green on a run that errored or blew its
      # turn budget. Placed here rather than later so a failed run does not go
      # on to sit out the 900s CI-gate wait.
      - name: Fail if the agent errored, now that its work is pushed
        if: steps.implement.outcome == 'failure'
        run: |
          echo "::error::The Implement step failed (see the log above). Any work it produced has been committed and pushed to factory/${{ github.event.issue.number || inputs.issue }} rather than discarded — check the branch before re-running, because the item may be further along than this failure suggests."
          exit 1

      # The PM's migration check runs at spec time and can only see what the
      # spec author foresaw. On #97 the spec header said "No database migration
      # required" while its body demanded state that survives restarts, so the
      # Engineer correctly added one — and the item reached human review without
      # the label that exists precisely to route migrations to individual review.
      # The label has to be re-derived from the tree whenever the tree changes.
      # Gated on the push, not on the outcome: a migration is a fact about the
      # branch, and the human picking up a spec-error escalation needs to know
      # about it just as much as a reviewer does.
      - name: Flag a migration introduced during implementation
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          git fetch --no-tags --quiet origin main
          # Three-dot: what this branch introduced, not everything that differs
          # between the two tips — a migration landing on main meanwhile is not
          # this item's migration.
          if ! git diff --name-only origin/main...HEAD | grep -q "^supabase/migrations/"; then
            echo "No migration on this branch."
            exit 0
          fi
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' \
               | grep -qx "needs-migration"; then
            echo "Migration present and already labelled needs-migration."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label needs-migration
          gh issue comment "$ISSUE" \
            --body "**Migration added during implementation.** This branch touches \`supabase/migrations/\`, which the spec-time check did not flag. Labelled \`needs-migration\`: it requires individual human review and the migration must be applied to production with \`supabase db push\` before the PR merges — schema precedes code."

      # The deterministic gate was trusted by name and never consulted. On #97
      # CI was red on every one of the five implementation pushes and the item
      # still reached QA three times — and QA's own prompt opens by saying
      # "deterministic CI already covers tests, types, lint and build", so it
      # was not looking either. Nothing may reach a reviewer that is reviewing
      # on that assumption unless the assumption holds.
      #
      # Waiting here rather than resolving it from a separate workflow_run
      # handler is deliberate. CI on this repo finishes in about two minutes,
      # the decision belongs to the job that made the push (it can name the
      # failing job in the same breath), and every way this step can fail —
      # red, never started, never finished, unqueryable — ends with the item
      # blocked. A workflow_run handler would need an intermediate label to
      # park the item in, and anything that went wrong there would strand it
      # with nothing left to notice. A silent stall is worse than a noisy
      # block: silence is exactly what let #97 through.
      - name: Require a green CI gate before handing to QA
        if: steps.push.outputs.outcome == 'pushed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          LABEL: ${{ github.event.label.name || inputs.stage }}
          BRANCH: factory/${{ github.event.issue.number || inputs.issue }}
          # ~7x the observed CI duration, against a 45 minute job budget.
          CI_WAIT_SECONDS: "900"
          CI_POLL_INTERVAL: "15"
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Waiting for the CI gate on $SHA (up to ${CI_WAIT_SECONDS}s)."
          END=$((SECONDS + CI_WAIT_SECONDS))

          while :; do
            if ! RUNS=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 30 \
                          --json databaseId,headSha,status,conclusion); then
              echo "::error::Could not query CI runs for $BRANCH. Refusing to advance on an unanswered question."
              exit 1
            fi
            # Matched on the exact SHA this job pushed. A green run belonging to
            # an earlier commit is not evidence about this one — that is how a
            # red branch would sail through. Newest first, so a re-run wins.
            RUN=$(printf '%s' "$RUNS" | jq -c --arg sha "$SHA" \
                    '[.[] | select(.headSha == $sha)] | first // empty')
            STATUS=$(printf '%s' "$RUN" | jq -r '.status // empty')
            if [ "$STATUS" = "completed" ]; then break; fi

            if [ "$SECONDS" -ge "$END" ]; then
              {
                echo "**CI never reported on \`$SHA\`** (last seen: ${STATUS:-no run at all}) after ${CI_WAIT_SECONDS}s. The branch cannot be handed to QA without a gate result — QA reviews on the assumption that tests, types, lint and build are already green. Marking blocked."
                /tmp/decision-section.sh "$ISSUE" spec-derived \
                  "CI never ran on the Engineer's commit — is the draft PR for \`$BRANCH\` still open?" \
                  "(a) the PR was closed or never created: reopen it, then resume at spec-derived (b) the PR is open and CI is simply slow or stuck: re-run the gate on \`$SHA\` and resume once it reports" \
                  "Check the PR first. CI is triggered by the pull request, so a closed or missing PR means no run will ever arrive no matter how long this waits." \
                    "unknown"
              } > /tmp/eng-noci.md
              gh issue comment "$ISSUE" --body-file /tmp/eng-noci.md
              gh issue edit "$ISSUE" --add-label blocked --remove-label "$LABEL"
              touch /tmp/factory-handled
              echo "::error::No completed CI run for $SHA within ${CI_WAIT_SECONDS}s (last seen: ${STATUS:-no run})."
              exit 1
            fi

            echo "CI on $SHA: ${STATUS:-no run yet} — waiting ${CI_POLL_INTERVAL}s."
            sleep "$CI_POLL_INTERVAL"
          done

          CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion')
          ID=$(printf '%s' "$RUN" | jq -r '.databaseId')
          URL="$SERVER_URL/$REPO/actions/runs/$ID"

          if [ "$CONCLUSION" = "success" ]; then
            echo "CI gate green on $SHA — $URL"
            exit 0
          fi

          FAILED=$(gh run view "$ID" --json jobs \
            | jq -r '[.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                      | "- **\(.name)** (\(.conclusion)) — \(.url)"] | join("\n")')

          # Which side of the frozen line the failure falls on decides what a
          # human can even do about it, and it is answerable from the log rather
          # than by asking them to go and read it. tests/acceptance/ is
          # read-only to the Engineer, so a gate failing inside it cannot be
          # cleared by ANY resume stage: `spec-derived` re-runs an agent that
          # cannot reach the file and reproduces this failure exactly.
          #
          # Asking anyway is not free. On 15 August six items (#96, #127, #199,
          # #212, #216, #219) sat in the digest carrying the identical question
          # "implementation, or the test it may not edit?", each needing the
          # same manual log read before anything could move.
          #
          # ATTRIBUTION, not mention. The version this replaces grepped the
          # whole failing log for any tests/acceptance/ path and named what it
          # found. On #244 that named five frozen contracts — 101, 106, 108,
          # 113, 115 — none of which had failed; the real failure was in
          # tests/regression/. It had tried to exclude passing lines by
          # anchoring on the marker, but vitest prefixes those markers with ANSI
          # colour codes, so the exclusion matched nothing and every PASSING
          # file was harvested, then `head -5` took the first five
          # alphabetically. Reading the log is not sufficient if you read it
          # credulously.
          #
          # A file is now named only where the log identifies it as the SUBJECT
          # of a failure — a vitest FAIL line, a tsc diagnostic, an ESLint error
          # block. Where nothing can be attributed, that is stated and the log
          # is quoted, rather than a file being offered up.
          gh run view "$ID" --log-failed > /tmp/ci-failed.log 2>/dev/null || true

          ATTRIBUTION=""
          if [ -x /tmp/attribute-failure.sh ]; then
            ATTRIBUTION=$(/tmp/attribute-failure.sh /tmp/ci-failed.log 2>/dev/null || true)
          fi
          FROZEN_HITS=$(printf '%s' "$ATTRIBUTION" | sed -n 's/^frozen=//p' | head -5)
          FAILING_SOURCES=$(printf '%s' "$ATTRIBUTION" | sed -n 's/^source=//p' | head -5)
          {
            echo "**CI is red on \`$SHA\` — not handing this to QA.**"
            echo
            echo "Gate run concluded \`$CONCLUSION\`: $URL"
            echo
            if [ -n "$FAILED" ]; then echo "$FAILED"; else echo "- (no per-job detail available)"; fi
            echo
            echo "QA reviews on the stated assumption that tests, types, lint and build are already green, so it is not the thing that will catch this. Marking blocked."
            echo

            # The log this workflow already fetched, quoted rather than only
            # grepped. A reader who has the failing lines in front of them can
            # judge the recommendation below; one who has only the job name has
            # to go and get them, which is the cost that made six items in a
            # single digest each need a manual log read before anything moved.
            if [ -s /tmp/ci-failed.log ]; then
              echo "Last 20 lines of the failing job:"
              echo
              echo '```'
              tail -n 20 /tmp/ci-failed.log | sed -E 's/^[^\t]*\t[^\t]*\t//' | cut -c1-300
              echo '```'
            else
              echo "The failing job's log could not be retrieved. That is a fact about the run, not a description of the failure — open $URL before deciding."
            fi

            if [ -n "$FROZEN_HITS" ]; then
              echo
              echo "The failing log names files the Engineer may not edit:"
              echo
              echo '```'
              echo "$FROZEN_HITS"
              echo '```'
              /tmp/decision-section.sh "$ISSUE" none \
                "The gate fails inside \`tests/acceptance/\`, which is frozen — how should the contract be corrected?" \
                "(a) amend the fix into the branch's FIRST commit by hand, the only commit permitted to touch tests/acceptance/, then resume at \`verify\` (b) re-derive the item from scratch: \`./scripts/factory/resume.sh $ISSUE needs-spec\`, discarding the branch" \
                "Not resumable at \`spec-derived\`: the Engineer cannot reach the failing file, so a re-run reproduces this exact gate failure and re-blocks. Prefer (b) when the test never compiled at all — that is the PM having written it wrong, and hand-patching a file that will be re-derived anyway wastes the effort. Prefer (a) for one wrong assertion in an otherwise sound suite." \
                  "The failing paths named above are under \`tests/acceptance/\`, which the Engineer may not edit and no Engineer re-run can reach. Only the branch's first commit may touch that file, so every fix here is a human one."
            elif [ -n "$FAILING_SOURCES" ]; then
              echo
              echo "The failing log attributes the failure to:"
              echo
              echo '```'
              echo "$FAILING_SOURCES"
              echo '```'
              /tmp/decision-section.sh "$ISSUE" spec-derived \
                "The gate is red on the Engineer's own commit and no frozen file failed — send it back to fix its implementation?" \
                "(a) resume at \`spec-derived\` so the Engineer fixes it (b) read the failing job first, if this same failure has already survived one retry" \
                "(a). Every file the failure is attributed to is one the Engineer can reach, so it is the right agent for this. A type error may be masking worse: it fails the gate early, so nothing downstream runs — fix it and run the full suite before judging the branch finished." \
                  "None: every file above is one the Engineer may edit. Frozen files that merely appear in the log are not listed, because appearing is not failing."
            else
              # Nothing could be attributed. Say that, and quote the log rather
              # than offering up a file — a guess here sends someone to the
              # wrong one, which is exactly what #244 cost.
              echo
              echo "**The failure could not be attributed to a file.** Nothing in the log identifies a failing test, a tsc diagnostic or an ESLint error, so no file is named here — naming one on the strength of a mention is how five innocent contracts got blamed on #244."
              /tmp/decision-section.sh "$ISSUE" spec-derived \
                "The gate is red on \`$SHA\` and the log does not say which file failed — what do the quoted lines above point at?" \
                "(a) read the quoted lines and act on what they name (b) open the failing job directly: $URL (c) if the log is genuinely empty, re-run the gate once — a runner that died before any test ran looks like this" \
                "No file is asserted. The evidence block above is everything this workflow read; anything more specific would be inference." \
                  "unknown — with no attributable failure, whether the fix lies inside what the Engineer may edit is not established."
            fi
          } > /tmp/ci-failure.md
          gh issue comment "$ISSUE" --body-file /tmp/ci-failure.md
          gh issue edit "$ISSUE" --add-label blocked --remove-label "$LABEL"
          touch /tmp/factory-handled
          echo "::error::CI gate concluded $CONCLUSION for $SHA. See $URL"
          exit 1

      - name: Advance state
        if: steps.push.outputs.outcome == 'pushed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          LABEL: ${{ github.event.label.name || inputs.stage }}
        run: |
          gh issue edit "$ISSUE" --remove-label "$LABEL" --add-label verify

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          # Comment composed BEFORE the label goes on, and never allowed to
          # abort it. This is the catch-all: it runs when the job died somewhere
          # with no handler, which includes dying before /tmp/decision-section.sh
          # was ever materialised. #160 hit exactly that and was labelled blocked
          # with no comment at all — a silent block, which is the one outcome
          # this whole layer exists to prevent, produced by the layer itself.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # A handled failure has already posted its specific question and
          # labelled the item. Posting the generic section on top of it is not a
          # second opinion, it is a worse one that WINS: the digest takes the
          # LAST comment carrying a DECISION NEEDED section, so the catch-all's
          # question silently replaced the handler's on every item that took a
          # handled path. #140 carries both, three seconds apart — "CI is red on
          # <sha>" at 23:58:00 and "Engineer agent failed" at 23:58:03 — and it
          # is the second that reached the digest. Six items were still being
          # reported that way on 15 August, each with a precise question sitting
          # unread directly above the vague one.
          #
          # The handler has already applied `blocked`, so standing down here
          # leaves the item correctly stopped, only better explained.
          if [ -f /tmp/factory-handled ]; then
            echo "Failure already handled and reported by the failing step — not posting the catch-all over it."
            exit 0
          fi

          # Which step died. Without it the question this block asks is "was it
          # transient or genuine?", which nobody can answer without opening the
          # run — six items carried that useless question at once, and every one
          # needed this same API call to diagnose. Asking for it here turns the
          # generic catch-all into a specific question.
          #
          # Retried once: this step runs inside the same job as the failure, and
          # the failing step's conclusion is occasionally not yet recorded when
          # the API is asked. An empty answer is degraded, not fatal — the
          # comment still posts, just without the step name.
          FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          if [ -z "$FAILED_STEP" ]; then
            sleep 5
            FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          fi
          [ -n "$FAILED_STEP" ] || FAILED_STEP="(could not be determined)"
          echo "Failing step: $FAILED_STEP"

          {
            echo "Engineer agent failed at step **$FAILED_STEP**. See the run log: $RUN_URL"
            echo
            echo "This is the catch-all: the job failed somewhere that has no handler of its own, so the run log is the only account of it."

            # EVIDENCE FIRST, and a diagnosis only as far as the evidence
            # carries it.
            #
            # This block used to `case` over the step NAME and attach a
            # confident cause to each arm — "the agent exhausted its turn
            # budget", "the Engineer produced no changes" — without reading a
            # line of the run. Of five blocking recommendations checked in the
            # 16-17 August field review, four rested on a premise that was false
            # by the time anyone read them, and acting on them would have spent
            # Engineer runs on items already past the problem. A cause inferred
            # from a step name is a guess wearing the clothes of a finding, and
            # it is worse than no recommendation because it is actionable.
            #
            # So: quote the log, then say only what the log supports. "Cause not
            # determined" is the DEFAULT here, not the fallback.
            if [ -x /tmp/failure-evidence.sh ]; then
              /tmp/failure-evidence.sh "${{ github.run_id }}" 20
            else
              echo "The evidence composer was not available in this run, so no log could be quoted. Open the run directly: $RUN_URL"
              echo
            fi

            gh run view "${{ github.run_id }}" --log-failed > /tmp/eng-catchall.log 2>/dev/null || true
            FROZEN=$(grep -oE '(tests/acceptance|docs/specs)/[A-Za-z0-9._/-]+' /tmp/eng-catchall.log 2>/dev/null | sort -u | head -3 || true)

            if grep -q "Reached maximum number of turns" /tmp/eng-catchall.log 2>/dev/null; then
              # Read, not inferred: this exact string is in the log above.
              Q="The log says the agent hit its turn cap during \`$FAILED_STEP\` — is this item too large for one run, or is the agent looping?"
              O="(a) split the item into smaller ones and re-derive from a sharpened roadmap card (b) read the quoted turns: a repeated edit-test-edit cycle over the same file is a loop, and re-running reproduces it"
              R="Not a retry. The cap is a runaway guard and hitting it means the run did not converge, so a second run has the same budget and the same item. #127 burned two full budgets before anyone looked."
              P="unknown — whether the work needs a file the Engineer may not touch is not established by a turn-cap message alone."
            elif [ -n "$FROZEN" ]; then
              Q="The failing log names frozen files ($FROZEN) — is the fix inside the contract rather than the implementation?"
              O="(a) amend the fix into the branch's FIRST commit by hand, the only commit permitted to touch these paths, then resume at \`verify\` (b) re-derive the item: \`./scripts/factory/resume.sh $ISSUE_NUMBER needs-spec\`"
              R="Read the quoted lines before choosing. Not resumable at \`spec-derived\`: the Engineer cannot reach the paths named above, so a re-run reproduces this failure exactly."
              P="The paths named above are frozen after the PM's first commit and the Engineer may not edit them, so no Engineer re-run reaches this. Both options are human actions."
            else
              # The honest default. Naming the step is a fact; naming a cause
              # would not be.
              Q="Step \`$FAILED_STEP\` failed and its cause is not determined — what do the quoted log lines above point at?"
              O="(a) act on whatever the quoted lines name (b) if they name nothing actionable, read the full run: $RUN_URL (c) if this step has now failed twice the same way, it needs a handler of its own rather than another retry"
              R="No cause is asserted here deliberately. The lines above are everything this workflow read; anything beyond them would be inference from the step's name, which has been wrong more often than it has been right."
              P="unknown — not assessed. The options above are the fixes available inside what the Engineer may edit."
            fi

            if [ -x /tmp/decision-section.sh ]; then
              /tmp/decision-section.sh "${{ github.event.issue.number || inputs.issue }}" spec-derived "$Q" "$O" "$R" "$P"
            else
              # The composer was never materialised, so the job died very early
              # — before any work could have been attempted. Say so plainly and
              # inline the section rather than emitting nothing.
              printf '\n## DECISION NEEDED\n'
              printf '**Question:** The Engineer job died before it began work — is this a factory fault or a transient runner failure?\n'
              printf '**Options:** (a) re-run the Engineer unchanged (b) read the run log — the job failed before setup completed, which usually means the workflow itself is broken rather than the item\n'
              printf '**Recommendation:** (b) first. Failing this early means checkout or setup broke, and no amount of retrying the item fixes a broken workflow.\n'
              printf '**Fixes outside my permissions:** not assessed — the job died before it could read anything about this item.\n'
              printf '**To resume:** ./scripts/factory/resume.sh %s spec-derived\n' "${{ github.event.issue.number || inputs.issue }}"
            fi
          } > /tmp/eng-catchall.md || true

          gh issue comment ${{ github.event.issue.number || inputs.issue }} --body-file /tmp/eng-catchall.md || \
            gh issue comment ${{ github.event.issue.number || inputs.issue }} \
              --body "Engineer agent failed and the failure comment could not be composed. Run log: $RUN_URL"
          gh issue edit ${{ github.event.issue.number || inputs.issue }} --add-label blocked
