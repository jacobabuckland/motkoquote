name: Factory — QA Agent

on:
  issues:
    types: [labeled]
  # Re-entrant by dispatch. The reconciler re-fires a stalled stage by
  # dispatching this workflow with the item's number, NOT by toggling its label:
  # re-applying a label an issue already carries fires the `labeled` event for
  # nobody, which is precisely the defect — an item whose consumer died looks
  # identical to one being worked on, and no amount of re-labelling wakes it.
  #
  # A dispatched run does exactly what a labelled one does. The two triggers
  # differ only in where the issue number and stage come from, which is why
  # every reference below reads `github.event.issue.number || inputs.issue`.
  workflow_dispatch:
    inputs:
      issue:
        description: "Factory issue number"
        required: true
      stage:
        description: "Stage this run acts on"
        required: true
        type: choice
        options:
          - verify
      reason:
        description: "Why this run was dispatched"
        required: false

# The issue number is stamped into the run name, and this is load-bearing: it is
# how the reconciler tells whether a stage is legitimately running before it
# considers re-firing one. Matching on the head branch cannot do that job — a run
# triggered by `issues.labeled` reports `head_branch: main`, so no label-triggered
# stage would ever look busy, and the PM stage has no branch to match at all until
# it pushes. GitHub evaluates `run-name` when the run is QUEUED, so the item is
# identifiable from before its first step.
run-name: QA [factory#${{ github.event.issue.number || inputs.issue }}] ${{ github.event.label.name || inputs.stage }}

concurrency:
  group: factory-${{ github.workflow }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event.label.name || inputs.stage) == 'verify' &&
      !contains(github.event.issue.labels.*.name, 'factory-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # A dispatched run has not passed through the label guard on the job, so
      # the item's eligibility is established here instead. Without this, the
      # `!contains(github.event.issue.labels.*.name, 'factory-meta')` condition
      # above is vacuously true on a dispatch — `github.event.issue` is null, so
      # the label list is empty and nothing is excluded.
      - name: Validate the dispatched item
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be a number, got '$ISSUE'."; exit 1 ;;
          esac
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::#$ISSUE is $STATE. Refusing to run a stage against a closed item."
            exit 1
          fi
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
          case ",$LABELS," in
            *,factory,*) ;;
            *) echo "::error::#$ISSUE does not carry the 'factory' label."; exit 1 ;;
          esac
          case ",$LABELS," in
            *,factory-meta,*) echo "::error::#$ISSUE is a factory-meta bookkeeping issue."; exit 1 ;;
          esac
          echo "Dispatched run for #$ISSUE accepted. Reason: ${REASON:-none given}"
      # Checked out before the cap rather than after it, and unconditionally:
      # the cap's own blocking path needs /tmp/decision-section.sh to
      # compose its decision section, and a step cannot use a repo it has not
      # checked out. Everything downstream still gates on the cap's output.
      - uses: actions/checkout@v4
        with:
          ref: factory/${{ github.event.issue.number || inputs.issue }}
          fetch-depth: 0

      # The composer lives on main, but this job checks out factory/N — and a
      # factory branch cut before this landed does not contain it. Materialised
      # from origin/main so every branch, however old, composes its decision
      # section from the same source the digest parses.
      - name: Materialise the decision-section composer
        run: |
          # NOT --depth=1: a shallow fetch of main truncates its history and
          # destroys the merge base, so every later `git diff origin/main...HEAD`
          # dies with "no merge base". QA's empty-branch check did exactly that
          # on #160 and reported it as "contains only spec and tests".
          git fetch origin main --quiet
          git show origin/main:scripts/factory/decision-section.sh > /tmp/decision-section.sh
          chmod +x /tmp/decision-section.sh
          # Same reasoning for the evidence composer: a blocking comment must be
          # able to quote the run it is about, and a branch cut before this
          # landed does not carry the script that does it.
          git show origin/main:scripts/factory/failure-evidence.sh > /tmp/failure-evidence.sh
          chmod +x /tmp/failure-evidence.sh
          git show origin/main:scripts/factory/qa-cap.sh > /tmp/qa-cap.sh
          # And the pre-push guard, as a hook. QA is a reviewer and should not be
          # pushing at all, but `actions/checkout` leaves credentials on the
          # remote and the agent has Bash, so "should not" is not a mechanism.
          # QA holds this checkout for the length of a review; if the item is
          # re-derived inside that window, any force-push from here restores a
          # superseded lineage — and with it the old acceptance tests, which no
          # later commit may repair. Tolerated if absent, so an older branch
          # still runs.
          if git show origin/main:scripts/factory/pre-push-guard.sh > /tmp/pre-push-guard.sh 2>/dev/null; then
            mkdir -p .git/hooks
            install -m 0755 /tmp/pre-push-guard.sh .git/hooks/pre-push
            echo "pre-push guard installed"
          fi
          # And the gate classifier (#283), which decides whether a run's
          # conclusion is a verdict at all. Tolerated if absent: a `git show`
          # for a path main does not have would abort this step under `bash -e`
          # and block the item. The use sites guard on `-f`.
          git show origin/main:scripts/factory/gate-verdict.mjs > /tmp/gate-verdict.mjs 2>/dev/null || true
          chmod +x /tmp/qa-cap.sh

      - name: Check the iteration cap
        id: cap
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          BRANCH: factory/${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail

          SHA=$(git rev-parse HEAD)
          echo "head=$SHA" >> "$GITHUB_OUTPUT"

          # Read, do not wait. The authoritative gate with its poll and its
          # blocking path is further down; this only needs to know whether a
          # completed green run already exists for this exact commit, so that a
          # finished item can leave without another review. Matched on the SHA,
          # never on the branch.
          CI="none"
          if RUNS=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 30 \
                      --json databaseId,headSha,status,conclusion 2>/dev/null); then
            CI=$(printf '%s' "$RUNS" | jq -r --arg sha "$SHA" \
                   '[.[] | select(.headSha == $sha and .status == "completed")] | first | .conclusion // "none"')
            # #283 — a cancelled run is not a conclusion. Left as "none" here so
            # the cap treats it as "no gate result yet" rather than as a failure
            # on the code; the authoritative gate below decides what to do.
            if [ -f /tmp/gate-verdict.mjs ]; then
              printf '%s' "$RUNS" > /tmp/gate-runs.json
              case "$(node /tmp/gate-verdict.mjs /tmp/gate-runs.json "$SHA" "$SHA" 2>/dev/null | sed -n 1p)" in
                green) CI="success" ;;
                red)   CI=$(node /tmp/gate-verdict.mjs /tmp/gate-runs.json "$SHA" "$SHA" 2>/dev/null | sed -n 2p) ;;
                "")    ;;
                *)     CI="none" ;;
              esac
            fi
          fi
          echo "CI for $SHA: $CI"

          gh api "repos/$GH_REPO/issues/$ISSUE/timeline" --paginate --slurp \
            | jq 'add // []' > /tmp/qa-timeline.json
          gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate --slurp \
            | jq 'add // []' > /tmp/qa-comments.json

          /tmp/qa-cap.sh /tmp/qa-timeline.json /tmp/qa-comments.json "$SHA" "$CI" \
            | tee -a "$GITHUB_OUTPUT"

          # The criteria QA has already raised, so the review below can reuse a
          # key when it re-raises one rather than inventing a new name for the
          # same objection — which would make every disagreement look fresh and
          # the cap unreachable.
          jq -r '[.[] | select(.body | startswith("**QA findings**")) | .body]
                 | last // "" ' /tmp/qa-comments.json \
            | grep -oE '^FINDING:[[:space:]]*[a-z0-9][a-z0-9-]*' \
            | sed -E 's/^FINDING:[[:space:]]*//' | sort -u > /tmp/prior-keys.txt || true
          {
            echo "prior_keys<<PRIOR_EOF"
            if [ -s /tmp/prior-keys.txt ]; then cat /tmp/prior-keys.txt; else echo "(none — this is the first review)"; fi
            echo "PRIOR_EOF"
          } >> "$GITHUB_OUTPUT"

      # A finished item must never need another cycle to escape a counter.
      #
      # QA has already passed the exact commit this branch points at and the
      # gate is green on that same commit, so there is nothing left to decide
      # and no agent is run. This is what four items needed in a single
      # afternoon and none of them had: #96, #185, #195 and #123 were all
      # stopped by the counter AFTER the Engineer had complied, with no route
      # out that did not involve running an agent that would find nothing to do.
      - name: Leave without a review when the work is already passed and green
        if: steps.cap.outputs.decision == 'exit-previewed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --body "**Advancing without another review.** QA's most recent verdict is a pass on \`${{ steps.cap.outputs.head }}\`, which is still the branch head, and the CI gate is green on that same commit. There is nothing for a reviewer to decide, so no agent was run.

          This exit exists because a finished item must never need another cycle to escape a counter. Before it, an item that was complete and capped had no route out that did not involve re-running an agent which would correctly find nothing to do — and be marked blocked for it."
          gh issue edit "$ISSUE" --remove-label verify --add-label previewed

      # The cap counts unresolved disagreements about the SAME criterion, not
      # rounds. A cycle in which the Engineer complied and QA raised something
      # new is progress and costs nothing.
      - name: Stop when one criterion keeps failing
        if: steps.cap.outputs.decision == 'cap'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          REASON: ${{ steps.cap.outputs.cap_reason }}
          WORST: ${{ steps.cap.outputs.worst_criterion }}
          WORST_COUNT: ${{ steps.cap.outputs.worst_count }}
          CYCLES: ${{ steps.cap.outputs.cycles }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --remove-label verify --add-label blocked

          {
            if [ "$REASON" = "criterion" ]; then
              echo "**Stopped: \`$WORST\` has been raised $WORST_COUNT times without being resolved.**"
              echo
              echo "This is not a round count. Cycles in which the Engineer complied and QA then raised something new do not count against the item — $CYCLES cycle(s) have run in total, and \`$WORST\` was raised in $WORST_COUNT of them."
              echo
              echo "**Check first that these are the same objection.** The cap counts a key, and a key is only as good as QA's naming of it. If the raisings below turn out to be unrelated gaps that happen to share a name, this stop is wrong and (b) is your answer — that is #273, which cost an intervention on #258 when \`incomplete-implementation\` collapsed a missing button and a tool-parameter violation into one. Keys on the catch-all list no longer count across cycles, so this should now be rare rather than routine."
              echo
              echo "The raisings, oldest first:"
              echo
              # Read off the comments rather than described. A stop that names a
              # key and then makes the reader go and find its raisings is how
              # #258 was answered wrongly — the two findings were a screen apart
              # and nobody put them side by side.
              RAISINGS=$(jq -r --arg k "$WORST" '
                [ .[] | select(.body | startswith("**QA findings**")) ]
                | to_entries[]
                | .key as $i
                | .value.body
                | split("\n")[]
                | select(startswith("FINDING: " + $k + " "))
                | "- cycle \($i + 1): " + .' /tmp/qa-comments.json 2>/dev/null || true)
              if [ -n "$RAISINGS" ]; then
                printf '%s\n' "$RAISINGS"
              else
                echo "- (the finding lines could not be read; open the QA comments above)"
              fi
              echo
              echo "A criterion that survives that many cycles is evidence about the contract, not the implementation: an Engineer that complied each time and still failed review is being judged against something that does not decide the question."
            else
              echo "**Stopped: $CYCLES review cycles without convergence.**"
              echo
              echo "No single criterion repeated often enough to trip the cap — each cycle raised something new. That is the runaway ceiling rather than a disagreement, and it usually means the item is larger than one spec."
            fi
            echo
            echo "**The escape is not \`spec-derived\`.** Resuming a complete item there re-runs the Engineer, which correctly finds nothing to do, and the push step reads that as a malfunction and blocks it again — a loop with no exit. The real routes out are:"
            echo
            echo "1. **The criterion is ambiguous.** Settle it in the spec's FIRST commit, then \`ANSWER: qa-changes\`. The counter is anchored to \`needs-spec\`, so this does not reset it — which is deliberate: correcting the contract should not buy three more arguments about it."
            echo "2. **QA was wrong.** \`ANSWER: verify\` to have it look again. **Post that comment AFTER this one, and post it as a comment — not as a label change.** The one review this buys is granted by comparing positions: the resume must come later than this stop, and it is recognised by the \`Resumed at \\\`verify\\\`\` comment the answer-resume workflow writes. An \`ANSWER\` posted moments BEFORE the stop does not count, and flipping the labels by hand posts no resume comment at all, so it does not count either. Both happened on #544 on 5 Sep and each cost a cycle."
            echo "3. **The work is finished.** Nothing is needed: once the gate is green on the branch head and QA's most recent verdict is a pass on that same commit, the item advances by itself with no agent run."
            echo "4. **The item is underspecified beyond repair.** \`ANSWER: needs-spec\` re-derives it and resets the counter, discarding the argument."

            /tmp/decision-section.sh "$ISSUE" none \
              "Three cycles could not settle \`$WORST\` — what does that criterion actually require?" \
              "(a) the criterion is ambiguous: settle it in the spec's first commit, then \`ANSWER: qa-changes\` (b) QA was wrong and the implementation is fine: \`ANSWER: verify\` (c) the item is underspecified beyond repair: \`ANSWER: needs-spec\` to re-derive it" \
              "Read the QA comments for \`$WORST\` specifically and ignore the rest — the other findings were resolved. If each cycle objected to a different reading of the same requirement, that is (a), and #93 is the worked example." \
              "QA cannot change the criterion it keeps failing the item against — that criterion lives in the spec, which is frozen after the PM's first commit. Neither another QA run nor another Engineer run reaches it, which is why this stopped rather than going round a fourth time."
          } > /tmp/qa-cap.md
          gh issue comment "$ISSUE" --body-file /tmp/qa-cap.md


      - name: Refuse to review an empty branch
        if: steps.cap.outputs.decision == 'proceed'
        run: |
          COMMITS=$(git rev-list --count origin/main..HEAD)
          echo "Commits ahead of main: $COMMITS"
          if [ "$COMMITS" -lt 2 ]; then
            echo "::error::No implementation commit on this branch - only the spec."
            exit 1
          fi
          # Three dots: what this branch introduced since the merge base. A
          # two-dot diff compares tips, so anything merged to main after this
          # branch was cut appears here as though the branch had deleted it —
          # which also means a branch carrying nothing but spec and tests can
          # look like it has an implementation as soon as main moves.
          # A missing merge base is an infrastructure fault, not an empty
          # branch, and must not be reported as one. #160 was told it contained
          # only spec and tests when in fact a shallow fetch had truncated
          # main's history — a misdiagnosis that sends a human to read a diff
          # that is fine.
          if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "::error::No merge base between origin/main and HEAD. main's history is incomplete in this checkout — this is a workflow fault, not a problem with the branch."
            exit 1
          fi

          if ! git diff --name-only origin/main...HEAD | grep -qv -e '^docs/specs/' -e '^tests/acceptance/'; then
            echo "::error::Branch contains only spec and tests. No implementation to review."
            exit 1
          fi

      # The prompt below tells this agent that deterministic CI already covers
      # tests, types, lint and build — which is only true if somebody checks,
      # and nobody did. On #97 three reviews ran over a gate that had been red
      # since the first implementation commit. A reviewer told to skip what CI
      # covers must not be handed a branch where CI failed; that is not a
      # second opinion, it is no opinion.
      #
      # Duplicated from the Engineer rather than shared as a script on purpose:
      # this job checks out factory/N, and factory branches cut before today do
      # not contain the script. Workflow files are always read from the default
      # branch, so only what lives in this YAML is guaranteed to be here.
      - name: Refuse to review a branch whose CI gate is red
        if: steps.cap.outputs.decision == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          BRANCH: factory/${{ github.event.issue.number || inputs.issue }}
          # Shorter than the Engineer's: by the time a label reaches this job
          # CI has normally long finished, so this returns immediately. The
          # wait exists for a human re-labelling verify mid-build.
          CI_WAIT_SECONDS: "600"
          CI_POLL_INTERVAL: "15"
        run: |
          SHA=$(git rev-parse HEAD)
          END=$((SECONDS + CI_WAIT_SECONDS))

          while :; do
            if ! RUNS=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 30 \
                          --json databaseId,headSha,status,conclusion); then
              echo "::error::Could not query CI runs for $BRANCH. Refusing to review on an unanswered question."
              exit 1
            fi
            # The exact commit under review, never a green run from an earlier one.
            RUN=$(printf '%s' "$RUNS" | jq -c --arg sha "$SHA" \
                    '[.[] | select(.headSha == $sha)] | first // empty')
            STATUS=$(printf '%s' "$RUN" | jq -r '.status // empty')

            # #283 — a cancelled run says nothing about the code. Refusing to
            # review on it is right; calling it a red gate is not, and that is
            # what sent a human to read a run log with no failure in it.
            # The conclusion of the JOB named `gate`, which is a different
            # question from the run's. A run rolls up to `cancelled` if ANY job
            # is, and a job killed by `timeout-minutes` reports as `cancelled`
            # rather than `failed` — so a slow sibling guard buries a good gate
            # result and QA refuses to review a green branch.
            GATE_CONCLUSION=""
            if [ "$STATUS" = "completed" ]; then
              RUN_ID=$(printf '%s' "$RUN" | jq -r '.databaseId // empty')
              if [ -n "$RUN_ID" ]; then
                GATE_CONCLUSION=$(gh run view "$RUN_ID" --json jobs \
                  --jq '[.jobs[] | select(.name == "gate") | .conclusion] | first // empty' \
                  2>/dev/null || true)
              fi
            fi

            VERDICT=""
            if [ -f /tmp/gate-verdict.mjs ]; then
              printf '%s' "$RUNS" > /tmp/gate-runs.json
              HEAD_NOW=$(git ls-remote origin "refs/heads/$BRANCH" 2>/dev/null | cut -f1)
              GV=$(node /tmp/gate-verdict.mjs /tmp/gate-runs.json "$SHA" "$HEAD_NOW" "$GATE_CONCLUSION" 2>/dev/null || true)
              VERDICT=$(printf '%s' "$GV" | sed -n 1p)
              VERDICT_DETAIL=$(printf '%s' "$GV" | sed -n 2p)
            fi

            case "$VERDICT" in
              green|red) break ;;
              superseded)
                echo "::notice::Branch head has moved to ${VERDICT_DETAIL}; $SHA is superseded. Not reviewing a commit nobody will merge — the newer head gets its own run."
                exit 1
                ;;
              no-verdict)
                echo "::error::No gate verdict for $SHA: ${VERDICT_DETAIL} Not reviewing a branch with no gate result — and note this is NOT a red gate."
                exit 1
                ;;
            esac

            # Fallback when the classifier is not staged: today's behaviour.
            if [ -z "$VERDICT" ] && [ "$STATUS" = "completed" ]; then break; fi

            if [ "$SECONDS" -ge "$END" ]; then
              echo "::error::No completed CI run for $SHA on $BRANCH within ${CI_WAIT_SECONDS}s (last seen: ${STATUS:-no run at all}). Refusing to review a branch with no gate result."
              exit 1
            fi

            echo "CI on $SHA: ${STATUS:-no run yet} — waiting ${CI_POLL_INTERVAL}s."
            sleep "$CI_POLL_INTERVAL"
          done

          CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion')
          ID=$(printf '%s' "$RUN" | jq -r '.databaseId')
          URL="$SERVER_URL/$REPO/actions/runs/$ID"

          # Handed to the catch-all below, because the failure a human needs to
          # read is in THIS run, not in the QA run that noticed it. See the
          # comment at the evidence call site.
          echo "GATE_RUN_ID=$ID" >> "$GITHUB_ENV"
          echo "GATE_RUN_URL=$URL" >> "$GITHUB_ENV"

          if [ "$CONCLUSION" != "success" ]; then
            echo "Failing jobs:"
            gh run view "$ID" --json jobs \
              | jq -r '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                       | "  \(.name) (\(.conclusion)) — \(.url)"'
            echo "::error::CI gate concluded $CONCLUSION for $SHA ($URL). Not reviewing: this agent is told deterministic CI is already green, so a red gate has to stop the item here, not reach a reviewer that is not looking for it."
            exit 1
          fi
          echo "CI gate green on $SHA — $URL"

      - name: Review
        if: steps.cap.outputs.decision == 'proceed'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-5
            --max-turns 40
            --allowedTools Read,Bash,Glob,Grep,Write
          prompt: |
            You are the QA Agent in the motko software factory.
            Read AGENTS.md in the repository root first and follow it exactly.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number || inputs.issue }}
            BRANCH: factory/${{ github.event.issue.number || inputs.issue }}

            Review what this branch introduces, which is exactly:

                git diff origin/main...HEAD

            Three dots, against the merge base. Do not review a two-dot diff.
            Two dots compares the branch tip with the main tip, so every commit
            merged to main after this branch was cut appears as though this
            branch deleted it. It did not, and merging cannot undo it: a merge
            applies only what the branch introduced since the merge base.

            A branch that is merely behind main is therefore not a finding, and
            neither is a file that only appears because main moved. If you
            believe this branch's changes genuinely conflict with something new
            on main, say so specifically and name both sides — but do not infer
            it from the shape of a diff.

            The spec is at docs/specs/${{ github.event.issue.number || inputs.issue }}.md.

            You are a SECOND OPINION, not the safety mechanism. Deterministic CI
            already covers tests, types, lint and build. Your job is what tests
            cannot see:

            - Does the diff match the spec, including the out-of-scope list?
            - Files touched outside the declared set?
            - Secrets, keys or credentials anywhere in the diff?
            - Migration safety: additive, reversible?
            - Supabase RLS respected? Any service-role key in a user-facing path?
            - Errors handled explicitly, or silently swallowed?
            - Dead code, commented-out code, stray debugging?
            - PII or payment data reaching logs?
            - Does it add user friction (new form fields, extra taps)? Justified?
            - SPEC FIDELITY: does this do what was actually asked, or something
              adjacent that happens to satisfy the tests?

            Be specific: name file and line, or approve. "Looks good" is not a
            review. Do not raise style preferences as findings.

            Write your verdict to /tmp/qa-verdict.txt as exactly one word on the
            first line — either PASS or CHANGES — followed by your findings.

            If your verdict is CHANGES, every finding must ALSO be declared on
            its own line, anywhere in the body, in exactly this form:

                FINDING: <key> — <one line saying what is wrong>

            The key is a short lowercase slug naming the CRITERION at issue, not
            the symptom: `workflow-integration-missing`, `spec-file-mismatch`,
            `command-injection`. Letters, digits and hyphens only.

            THESE KEYS ARE FORBIDDEN, because they name a symptom class rather
            than a criterion and any two unrelated gaps land under them:

                incomplete-implementation, incomplete, missing,
                missing-implementation, not-implemented, bug, bugs, broken,
                incorrect, error, errors, issue, issues, problem, problems,
                quality, correctness, spec-fidelity, spec-violation

            The cap does not count them across cycles, so using one does not
            stop the item early — it makes your objection invisible to the
            counter, which is worse. `incomplete-implementation` on #258
            collapsed a missing "Edit" button and a money-integrity violation
            into a single "criterion" that had supposedly gone unresolved five
            times; both had in fact been fixed on the cycle they were raised.
            Name what is actually wrong: `edit-button-missing`,
            `amount-authored-by-model`.

            The keys are how the iteration cap works, and getting them wrong has
            a specific cost in both directions. The cap counts how many times the
            SAME criterion has been raised without being resolved — not how many
            rounds have happened — because a cycle in which the Engineer complied
            and you then raised something new is progress, and counting it as
            failure stopped four finished items in a single afternoon.

            So:
            - RE-RAISING something from a previous cycle? Reuse its key exactly.
              Inventing a new name for the same objection makes a stuck argument
              look like steady progress, and the loop never stops.
            - Raising something genuinely NEW? Give it a new key. Reusing an old
              key for a different objection stops the item early and wrongly.

            Criteria you raised on the previous cycle, for reuse:

                ${{ steps.cap.outputs.prior_keys }}

            A criterion you raised before and are NOT re-raising is one you
            consider resolved. That is the normal outcome and needs no comment.

      - name: Route on verdict
        if: steps.cap.outputs.decision == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          CYCLES: ${{ steps.cap.outputs.cycles }}
        run: |
          set -euo pipefail

          VERDICT=$(head -n1 /tmp/qa-verdict.txt 2>/dev/null || echo "CHANGES")
          BODY=$(tail -n +2 /tmp/qa-verdict.txt 2>/dev/null || echo "No findings recorded.")

          # The SHA this review was actually about. A verdict without it is an
          # opinion with no subject: the reconciler has to know whether a PASS
          # describes the commit the branch still points at or one three pushes
          # ago, and "the latest QA comment" cannot answer that. Everything
          # downstream that reads a verdict is gated on this matching the branch
          # head, so an unstamped verdict decides nothing rather than deciding
          # wrongly.
          SHA=$(git rev-parse HEAD)

          # Composed to a file rather than interpolated: the review body is
          # agent-written free text and may contain any quote or backtick.
          if [ "$VERDICT" = "PASS" ]; then
            HEADER="**QA passed**"
          else
            HEADER="**QA findings** (cycle $((CYCLES + 1)))"
            VERDICT=CHANGES
          fi

          {
            echo "$HEADER"
            echo
            printf '%s\n' "$BODY"
            echo
            printf '<!-- qa-verdict verdict=%s sha=%s -->\n' "$VERDICT" "$SHA"
          } > /tmp/qa-comment.md

          gh issue comment "$ISSUE" --body-file /tmp/qa-comment.md

          if [ "$VERDICT" = "PASS" ]; then
            gh issue edit "$ISSUE" --remove-label verify --add-label previewed
          else
            gh issue edit "$ISSUE" --remove-label verify --add-label qa-changes
          fi

      # QA had no catch-all, so a job that died anywhere left the item sitting
      # at `verify` with no comment, no block and no run to point at. That is
      # what stranded #140 for two and a half hours and #160 after its QA hit
      # the shallow-fetch bug: both looked mid-review and neither was.
      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          if [ -z "$FAILED_STEP" ]; then
            sleep 5
            FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          fi
          [ -n "$FAILED_STEP" ] || FAILED_STEP="(could not be determined)"

          # Composed before the label moves, and never allowed to abort it.
          {
            echo "QA failed at step **$FAILED_STEP**. See the run log: $RUN_URL"
            echo
            echo "The item did not receive a review, so nothing about the implementation has been judged either way."
            echo

            # The log, before the question about it. Everything below is read
            # off these lines; nothing is inferred from the step's name.
            #
            # THE RUN ID MATTERS. This used to pass ${{ github.run_id }} — QA's
            # own run — and the evidence block came back "the failing log could
            # not be retrieved" every single time. That is not a permission
            # problem and no retry fixes it: GitHub does not serve logs for a
            # run that has not finished, and the job asking is the one keeping
            # it unfinished. #306 blocked overnight on a comment that named two
            # possible causes and could quote neither, when the actual failure
            # was one flaky assertion in the CI gate run whose id QA already
            # had in hand.
            #
            # So: quote the gate run when the gate is what failed, and fall
            # back to our own run id only for failures that really are ours —
            # where the composer will now say plainly that a run cannot read
            # its own log, rather than implying the log was empty.
            if [ -x /tmp/failure-evidence.sh ]; then
              /tmp/failure-evidence.sh "${GATE_RUN_ID:-${{ github.run_id }}}" 20
            else
              echo "The evidence composer was not available in this run, so no log could be quoted. Open the run directly: $RUN_URL"
              echo
            fi

            if [ -x /tmp/decision-section.sh ]; then
              /tmp/decision-section.sh "${{ github.event.issue.number || inputs.issue }}" verify \
                "QA failed at \`$FAILED_STEP\` before reviewing and its cause is not determined — what do the quoted lines above name?" \
                "(a) act on whatever the quoted lines name (b) if they name nothing actionable, re-run QA once — the pre-review checks describe the branch rather than the code, so a branch that has moved may now pass (c) read the full run: ${GATE_RUN_URL:-$RUN_URL}" \
                "No cause is asserted. The quoted lines are everything this workflow read; \`Refuse to review an empty branch\` and the CI-gate check are the historically common culprits, but which one this was is a question the log answers and the step name does not." \
                  "QA reads the branch and writes a verdict; it cannot change the branch, the spec or the acceptance tests. If the quoted lines name a frozen path, no QA re-run reaches it."
            else
              printf '\n## DECISION NEEDED\n'
              printf '**Question:** QA died before it could review — factory fault or branch fault?\n'
              printf '**Options:** (a) re-run QA (b) read the run log first\n'
              printf '**Recommendation:** (b) if it failed this early; the composer was never materialised, which means setup broke.\n'
              printf '**Fixes outside my permissions:** not assessed — the job died before it could read anything about this item.\n'
              printf '**To resume:** ./scripts/factory/resume.sh %s verify\n' "${{ github.event.issue.number || inputs.issue }}"
            fi
          } > /tmp/qa-catchall.md || true

          gh issue comment ${{ github.event.issue.number || inputs.issue }} --body-file /tmp/qa-catchall.md || \
            gh issue comment ${{ github.event.issue.number || inputs.issue }} \
              --body "QA failed and the failure comment could not be composed. Run log: $RUN_URL"
          gh issue edit ${{ github.event.issue.number || inputs.issue }} --remove-label verify --add-label blocked
