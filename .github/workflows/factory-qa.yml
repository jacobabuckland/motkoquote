name: Factory — QA Agent

on:
  issues:
    types: [labeled]
  # Re-entrant by dispatch. The reconciler re-fires a stalled stage by
  # dispatching this workflow with the item's number, NOT by toggling its label:
  # re-applying a label an issue already carries fires the `labeled` event for
  # nobody, which is precisely the defect — an item whose consumer died looks
  # identical to one being worked on, and no amount of re-labelling wakes it.
  #
  # A dispatched run does exactly what a labelled one does. The two triggers
  # differ only in where the issue number and stage come from, which is why
  # every reference below reads `github.event.issue.number || inputs.issue`.
  workflow_dispatch:
    inputs:
      issue:
        description: "Factory issue number"
        required: true
      stage:
        description: "Stage this run acts on"
        required: true
        type: choice
        options:
          - verify
      reason:
        description: "Why this run was dispatched"
        required: false

# The issue number is stamped into the run name, and this is load-bearing: it is
# how the reconciler tells whether a stage is legitimately running before it
# considers re-firing one. Matching on the head branch cannot do that job — a run
# triggered by `issues.labeled` reports `head_branch: main`, so no label-triggered
# stage would ever look busy, and the PM stage has no branch to match at all until
# it pushes. GitHub evaluates `run-name` when the run is QUEUED, so the item is
# identifiable from before its first step.
run-name: QA [factory#${{ github.event.issue.number || inputs.issue }}] ${{ github.event.label.name || inputs.stage }}

concurrency:
  group: factory-${{ github.workflow }}-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event.label.name || inputs.stage) == 'verify' &&
      !contains(github.event.issue.labels.*.name, 'factory-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # A dispatched run has not passed through the label guard on the job, so
      # the item's eligibility is established here instead. Without this, the
      # `!contains(github.event.issue.labels.*.name, 'factory-meta')` condition
      # above is vacuously true on a dispatch — `github.event.issue` is null, so
      # the label list is empty and nothing is excluded.
      - name: Validate the dispatched item
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be a number, got '$ISSUE'."; exit 1 ;;
          esac
          STATE=$(gh issue view "$ISSUE" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::#$ISSUE is $STATE. Refusing to run a stage against a closed item."
            exit 1
          fi
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
          case ",$LABELS," in
            *,factory,*) ;;
            *) echo "::error::#$ISSUE does not carry the 'factory' label."; exit 1 ;;
          esac
          case ",$LABELS," in
            *,factory-meta,*) echo "::error::#$ISSUE is a factory-meta bookkeeping issue."; exit 1 ;;
          esac
          echo "Dispatched run for #$ISSUE accepted. Reason: ${REASON:-none given}"
      # Checked out before the cap rather than after it, and unconditionally:
      # the cap's own blocking path needs /tmp/decision-section.sh to
      # compose its decision section, and a step cannot use a repo it has not
      # checked out. Everything downstream still gates on the cap's output.
      - uses: actions/checkout@v4
        with:
          ref: factory/${{ github.event.issue.number || inputs.issue }}
          fetch-depth: 0

      # The composer lives on main, but this job checks out factory/N — and a
      # factory branch cut before this landed does not contain it. Materialised
      # from origin/main so every branch, however old, composes its decision
      # section from the same source the digest parses.
      - name: Materialise the decision-section composer
        run: |
          # NOT --depth=1: a shallow fetch of main truncates its history and
          # destroys the merge base, so every later `git diff origin/main...HEAD`
          # dies with "no merge base". QA's empty-branch check did exactly that
          # on #160 and reported it as "contains only spec and tests".
          git fetch origin main --quiet
          git show origin/main:scripts/factory/decision-section.sh > /tmp/decision-section.sh
          chmod +x /tmp/decision-section.sh
          # Same reasoning for the evidence composer: a blocking comment must be
          # able to quote the run it is about, and a branch cut before this
          # landed does not carry the script that does it.
          git show origin/main:scripts/factory/failure-evidence.sh > /tmp/failure-evidence.sh
          chmod +x /tmp/failure-evidence.sh

      - name: Check the iteration cap
        id: cap
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TIMELINE="repos/${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue }}/timeline"
          # Anchor the cap to the CURRENT attempt: count qa-changes cycles since the latest
          # spec-derived label, not a wall-clock window. A rolling window can age out cycle 1
          # of a slow-but-active loop, undercount, and let the three-cycle cap be exceeded
          # (unbounded loop). If no spec-derived event exists, SINCE is empty and we count
          # every qa-changes event on the issue — failing closed toward the cap, never open.
          SINCE=$(gh api "$TIMELINE" --paginate --slurp \
            | jq -r '(add // []) | map(select(.event=="labeled" and .label.name=="spec-derived")) | last | .created_at // empty')
          export SINCE
          echo "Counting cycles since: ${SINCE:-<all time — no spec-derived event found>}"
          CYCLES=$(gh api "$TIMELINE" --paginate --slurp \
            | jq '[(add // [])[] | select(.event=="labeled" and .label.name=="qa-changes" and ((env.SINCE // "") == "" or .created_at > env.SINCE))] | length')
          echo "Completed QA cycles: $CYCLES"
          echo "cycles=$CYCLES" >> "$GITHUB_OUTPUT"

      - name: Stop at three cycles
        if: steps.cap.outputs.cycles >= 3
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit ${{ github.event.issue.number || inputs.issue }} \
            --remove-label verify --add-label blocked
          {
            echo "**Iteration cap reached.** Three QA↔Engineer cycles completed without convergence. Stopping to avoid an unbounded loop."
            echo
            echo "Three cycles without agreement is evidence about the contract, not the implementation: an Engineer that complied three times and still failed review is usually being judged against something that does not decide the question."
            /tmp/decision-section.sh "${{ github.event.issue.number || inputs.issue }}" none \
              "Three QA cycles disagreed — which criterion did they keep reopening, and what does it actually require?" \
              "(a) the criterion is ambiguous: settle it in the spec's first commit, then resume at qa-changes (b) QA was wrong and the implementation is fine: resume at verify (c) the item is underspecified beyond repair: close it and re-spec, as #97 was" \
              "Read the three QA comments and look for the criterion that appears in all of them. If each cycle objected to a different reading of the same requirement, that is (a) — and #93 is the worked example." \
                "QA cannot change the criterion it keeps failing the item against — that criterion lives in the spec, which is frozen after the PM's first commit. If the criterion is the problem, neither another QA run nor another Engineer run resolves it."
          } > /tmp/qa-cap.md
          gh issue comment ${{ github.event.issue.number || inputs.issue }} --body-file /tmp/qa-cap.md
          exit 0


      - name: Refuse to review an empty branch
        if: steps.cap.outputs.cycles < 3
        run: |
          COMMITS=$(git rev-list --count origin/main..HEAD)
          echo "Commits ahead of main: $COMMITS"
          if [ "$COMMITS" -lt 2 ]; then
            echo "::error::No implementation commit on this branch - only the spec."
            exit 1
          fi
          # Three dots: what this branch introduced since the merge base. A
          # two-dot diff compares tips, so anything merged to main after this
          # branch was cut appears here as though the branch had deleted it —
          # which also means a branch carrying nothing but spec and tests can
          # look like it has an implementation as soon as main moves.
          # A missing merge base is an infrastructure fault, not an empty
          # branch, and must not be reported as one. #160 was told it contained
          # only spec and tests when in fact a shallow fetch had truncated
          # main's history — a misdiagnosis that sends a human to read a diff
          # that is fine.
          if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "::error::No merge base between origin/main and HEAD. main's history is incomplete in this checkout — this is a workflow fault, not a problem with the branch."
            exit 1
          fi

          if ! git diff --name-only origin/main...HEAD | grep -qv -e '^docs/specs/' -e '^tests/acceptance/'; then
            echo "::error::Branch contains only spec and tests. No implementation to review."
            exit 1
          fi

      # The prompt below tells this agent that deterministic CI already covers
      # tests, types, lint and build — which is only true if somebody checks,
      # and nobody did. On #97 three reviews ran over a gate that had been red
      # since the first implementation commit. A reviewer told to skip what CI
      # covers must not be handed a branch where CI failed; that is not a
      # second opinion, it is no opinion.
      #
      # Duplicated from the Engineer rather than shared as a script on purpose:
      # this job checks out factory/N, and factory branches cut before today do
      # not contain the script. Workflow files are always read from the default
      # branch, so only what lives in this YAML is guaranteed to be here.
      - name: Refuse to review a branch whose CI gate is red
        if: steps.cap.outputs.cycles < 3
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          BRANCH: factory/${{ github.event.issue.number || inputs.issue }}
          # Shorter than the Engineer's: by the time a label reaches this job
          # CI has normally long finished, so this returns immediately. The
          # wait exists for a human re-labelling verify mid-build.
          CI_WAIT_SECONDS: "600"
          CI_POLL_INTERVAL: "15"
        run: |
          SHA=$(git rev-parse HEAD)
          END=$((SECONDS + CI_WAIT_SECONDS))

          while :; do
            if ! RUNS=$(gh run list --workflow=ci.yml --branch "$BRANCH" --limit 30 \
                          --json databaseId,headSha,status,conclusion); then
              echo "::error::Could not query CI runs for $BRANCH. Refusing to review on an unanswered question."
              exit 1
            fi
            # The exact commit under review, never a green run from an earlier one.
            RUN=$(printf '%s' "$RUNS" | jq -c --arg sha "$SHA" \
                    '[.[] | select(.headSha == $sha)] | first // empty')
            STATUS=$(printf '%s' "$RUN" | jq -r '.status // empty')
            if [ "$STATUS" = "completed" ]; then break; fi

            if [ "$SECONDS" -ge "$END" ]; then
              echo "::error::No completed CI run for $SHA on $BRANCH within ${CI_WAIT_SECONDS}s (last seen: ${STATUS:-no run at all}). Refusing to review a branch with no gate result."
              exit 1
            fi

            echo "CI on $SHA: ${STATUS:-no run yet} — waiting ${CI_POLL_INTERVAL}s."
            sleep "$CI_POLL_INTERVAL"
          done

          CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion')
          ID=$(printf '%s' "$RUN" | jq -r '.databaseId')
          URL="$SERVER_URL/$REPO/actions/runs/$ID"

          if [ "$CONCLUSION" != "success" ]; then
            echo "Failing jobs:"
            gh run view "$ID" --json jobs \
              | jq -r '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                       | "  \(.name) (\(.conclusion)) — \(.url)"'
            echo "::error::CI gate concluded $CONCLUSION for $SHA ($URL). Not reviewing: this agent is told deterministic CI is already green, so a red gate has to stop the item here, not reach a reviewer that is not looking for it."
            exit 1
          fi
          echo "CI gate green on $SHA — $URL"

      - name: Review
        if: steps.cap.outputs.cycles < 3
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-5
            --max-turns 40
            --allowedTools Read,Bash,Glob,Grep,Write
          prompt: |
            You are the QA Agent in the motko software factory.
            Read AGENTS.md in the repository root first and follow it exactly.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number || inputs.issue }}
            BRANCH: factory/${{ github.event.issue.number || inputs.issue }}

            Review what this branch introduces, which is exactly:

                git diff origin/main...HEAD

            Three dots, against the merge base. Do not review a two-dot diff.
            Two dots compares the branch tip with the main tip, so every commit
            merged to main after this branch was cut appears as though this
            branch deleted it. It did not, and merging cannot undo it: a merge
            applies only what the branch introduced since the merge base.

            A branch that is merely behind main is therefore not a finding, and
            neither is a file that only appears because main moved. If you
            believe this branch's changes genuinely conflict with something new
            on main, say so specifically and name both sides — but do not infer
            it from the shape of a diff.

            The spec is at docs/specs/${{ github.event.issue.number || inputs.issue }}.md.

            You are a SECOND OPINION, not the safety mechanism. Deterministic CI
            already covers tests, types, lint and build. Your job is what tests
            cannot see:

            - Does the diff match the spec, including the out-of-scope list?
            - Files touched outside the declared set?
            - Secrets, keys or credentials anywhere in the diff?
            - Migration safety: additive, reversible?
            - Supabase RLS respected? Any service-role key in a user-facing path?
            - Errors handled explicitly, or silently swallowed?
            - Dead code, commented-out code, stray debugging?
            - PII or payment data reaching logs?
            - Does it add user friction (new form fields, extra taps)? Justified?
            - SPEC FIDELITY: does this do what was actually asked, or something
              adjacent that happens to satisfy the tests?

            Be specific: name file and line, or approve. "Looks good" is not a
            review. Do not raise style preferences as findings.

            Write your verdict to /tmp/qa-verdict.txt as exactly one word on the
            first line — either PASS or CHANGES — followed by your findings.

      - name: Route on verdict
        if: steps.cap.outputs.cycles < 3
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          CYCLES: ${{ steps.cap.outputs.cycles }}
        run: |
          set -euo pipefail

          VERDICT=$(head -n1 /tmp/qa-verdict.txt 2>/dev/null || echo "CHANGES")
          BODY=$(tail -n +2 /tmp/qa-verdict.txt 2>/dev/null || echo "No findings recorded.")

          # The SHA this review was actually about. A verdict without it is an
          # opinion with no subject: the reconciler has to know whether a PASS
          # describes the commit the branch still points at or one three pushes
          # ago, and "the latest QA comment" cannot answer that. Everything
          # downstream that reads a verdict is gated on this matching the branch
          # head, so an unstamped verdict decides nothing rather than deciding
          # wrongly.
          SHA=$(git rev-parse HEAD)

          # Composed to a file rather than interpolated: the review body is
          # agent-written free text and may contain any quote or backtick.
          if [ "$VERDICT" = "PASS" ]; then
            HEADER="**QA passed**"
          else
            HEADER="**QA findings** (cycle $((CYCLES + 1)) of 3)"
            VERDICT=CHANGES
          fi

          {
            echo "$HEADER"
            echo
            printf '%s\n' "$BODY"
            echo
            printf '<!-- qa-verdict verdict=%s sha=%s -->\n' "$VERDICT" "$SHA"
          } > /tmp/qa-comment.md

          gh issue comment "$ISSUE" --body-file /tmp/qa-comment.md

          if [ "$VERDICT" = "PASS" ]; then
            gh issue edit "$ISSUE" --remove-label verify --add-label previewed
          else
            gh issue edit "$ISSUE" --remove-label verify --add-label qa-changes
          fi

      # QA had no catch-all, so a job that died anywhere left the item sitting
      # at `verify` with no comment, no block and no run to point at. That is
      # what stranded #140 for two and a half hours and #160 after its QA hit
      # the shallow-fetch bug: both looked mid-review and neither was.
      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          if [ -z "$FAILED_STEP" ]; then
            sleep 5
            FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || true)
          fi
          [ -n "$FAILED_STEP" ] || FAILED_STEP="(could not be determined)"

          # Composed before the label moves, and never allowed to abort it.
          {
            echo "QA failed at step **$FAILED_STEP**. See the run log: $RUN_URL"
            echo
            echo "The item did not receive a review, so nothing about the implementation has been judged either way."
            echo

            # The log, before the question about it. Everything below is read
            # off these lines; nothing is inferred from the step's name.
            if [ -x /tmp/failure-evidence.sh ]; then
              /tmp/failure-evidence.sh "${{ github.run_id }}" 20
            else
              echo "The evidence composer was not available in this run, so no log could be quoted. Open the run directly: $RUN_URL"
              echo
            fi

            if [ -x /tmp/decision-section.sh ]; then
              /tmp/decision-section.sh "${{ github.event.issue.number || inputs.issue }}" verify \
                "QA failed at \`$FAILED_STEP\` before reviewing and its cause is not determined — what do the quoted lines above name?" \
                "(a) act on whatever the quoted lines name (b) if they name nothing actionable, re-run QA once — the pre-review checks describe the branch rather than the code, so a branch that has moved may now pass (c) read the full run: $RUN_URL" \
                "No cause is asserted. The quoted lines are everything this workflow read; \`Refuse to review an empty branch\` and the CI-gate check are the historically common culprits, but which one this was is a question the log answers and the step name does not." \
                  "QA reads the branch and writes a verdict; it cannot change the branch, the spec or the acceptance tests. If the quoted lines name a frozen path, no QA re-run reaches it."
            else
              printf '\n## DECISION NEEDED\n'
              printf '**Question:** QA died before it could review — factory fault or branch fault?\n'
              printf '**Options:** (a) re-run QA (b) read the run log first\n'
              printf '**Recommendation:** (b) if it failed this early; the composer was never materialised, which means setup broke.\n'
              printf '**Fixes outside my permissions:** not assessed — the job died before it could read anything about this item.\n'
              printf '**To resume:** ./scripts/factory/resume.sh %s verify\n' "${{ github.event.issue.number || inputs.issue }}"
            fi
          } > /tmp/qa-catchall.md || true

          gh issue comment ${{ github.event.issue.number || inputs.issue }} --body-file /tmp/qa-catchall.md || \
            gh issue comment ${{ github.event.issue.number || inputs.issue }} \
              --body "QA failed and the failure comment could not be composed. Run log: $RUN_URL"
          gh issue edit ${{ github.event.issue.number || inputs.issue }} --remove-label verify --add-label blocked
