name: Chain Test B (listener)

on:
  issues:
    types: [labeled]

jobs:
  chain-works:
    if: github.event.label.name == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the chain fired
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          echo "Chain works - B fired from A's label write."
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Chain test passed. FACTORY_TOKEN label writes trigger downstream workflows."
