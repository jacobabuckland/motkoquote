name: Factory — PM Agent

on:
  issues:
    types: [labeled]

concurrency:
  group: factory-${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  derive-spec:
    if: >-
      github.event.label.name == 'needs-spec' &&
      !contains(github.event.issue.labels.*.name, 'factory-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Create factory branch
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          BRANCH="factory/${{ github.event.issue.number }}"
          git config user.name "motko-factory"
          git config user.email "factory@motko.local"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # Recorded before the agent runs, so "did it do any work" can be answered
      # against a fixed point rather than against the index. The old check asked
      # `git diff --cached --quiet`, which compares the index to HEAD — an agent
      # that committed its own work therefore looked identical to one that wrote
      # nothing. #96 and #148 both wrote a full spec and passing-for-the-right-
      # reason tests, committed them, and were failed as malfunctions; the work
      # died with the runner because the branch is only pushed further down.
      - name: Record the baseline commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive spec and acceptance tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The agent's turns go to the run log, permanently, not as a
          # temporary debugging switch. #118 failed three times in three
          # different ways — spec without tests, then again, then nothing
          # written at all — and every diagnosis was guesswork, because the only
          # evidence outside the runner was a turn count and an exit code. A PM
          # that reports success while producing nothing cannot be debugged from
          # a turn count.
          #
          # READ THIS BEFORE COPYING IT ELSEWHERE. The action hides agent output
          # by default so a prompt cannot echo a secret into a log. THIS
          # REPOSITORY IS PUBLIC, so its Actions logs are world-readable: every
          # PM transcript published here is public and indexable. That was
          # weighed and accepted — the agent reads only material that is already
          # public (this repo, the issue body, AGENTS.md), and the one secret in
          # this step's environment, ANTHROPIC_API_KEY, is a repo secret and so
          # is masked as *** by GitHub.
          #
          # The residual risk is not zero: masking is literal, so a secret that
          # gets split, encoded or transformed before printing would not be
          # caught, and the agent has Bash. Revisit if issue bodies start
          # carrying commercially sensitive detail, or turn it off once the PM
          # is behaving and the visibility has served its purpose.
          show_full_output: true
          # max-turns is 100 rather than 50 because #95 and #96 both reported
          # success and were failed anyway, at 55 and 57 turns, while six
          # comparable items landed in 20-43. The old ceiling sat 7 turns above
          # the best successful run — thin enough that an item needing any
          # unusual exploration overran it. The cap still exists to stop a
          # genuine loop; the headroom is not a licence for an item to sprawl.
          claude_args: |
            --model claude-sonnet-4-5
            --max-turns 100
            --allowedTools Read,Write,Edit,Bash,Glob,Grep
          prompt: |
            You are the PM Agent in the motko software factory.
            Read AGENTS.md in the repository root first and follow it exactly.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}

            ISSUE BODY (this originates from a human-written Notion spec — it is
            the source of truth; translate it faithfully, do not reinterpret it):
            ---
            ${{ github.event.issue.body }}
            ---

            Produce exactly two artefacts. Do NOT write any application code.

            1. docs/specs/${{ github.event.issue.number }}.md containing:
               - Problem (one paragraph)
               - Scope: what changes
               - Explicitly out of scope: what does not change
               - Files: the complete list you expect the Engineer to touch
               - Edge cases, including failure modes and empty states
               - Risks: anything touching money, migrations, or user data

            2. Failing acceptance tests at
               tests/acceptance/${{ github.event.issue.number }}.test.ts

               Use the .tsx extension instead —
               tests/acceptance/${{ github.event.issue.number }}.test.tsx —
               if the tests render a component, because JSX does not compile
               in a .ts file. Both extensions are accepted. Any other path or
               name is not: the pipeline looks for exactly these two.

            Rules:
            - Do NOT run git commit, git push, or git checkout. Write the two
              files and leave them in the working tree; this workflow commits
              them, pushes the branch and opens the draft PR for you. Committing
              yourself is not fatal any more, but the commit this workflow makes
              is the one the immutability guard treats as the spec commit, and
              you cannot see that machinery from where you are.
            - Tests must fail for the right reason before implementation.
              Run them and confirm this.
            - Your test file must also pass lint and typecheck. Run BOTH before
              you finish:

                  npx eslint tests/acceptance/${{ github.event.issue.number }}.test.ts*
                  npm run typecheck

              and fix anything they report. This is not optional tidiness. The
              acceptance tests are frozen after your commit — the Engineer is
              forbidden from touching them — so a test that fails lint or
              typecheck cannot be repaired downstream and blocks the item
              permanently. #132, #145 and #149 all died this way overnight.
            - Two traps specifically, both of which have already cost items:
              * Do NOT name a variable `module`. Next's
                @next/next/no-assign-module-variable rejects it as an error,
                and `const module = await import(...)` is the natural phrasing,
                so reach for `mod` or `imported` instead.
              * Do NOT use `any`. @typescript-eslint/no-explicit-any is an
                error here, not a warning.
            - Test observable behaviour, not implementation detail.
            - Match the existing test conventions in this repo (vitest).
            - If the item requires a database migration, say so prominently at
              the top of the spec — it changes the review path.
            - There are exactly two reasons to write a spec with no tests, and
              both use the same escape line. Take it if EITHER holds:

              (a) The item is genuinely ambiguous — you cannot tell what is
                  being asked, or it depends on information you were not given
                  (a design review, a value, a decision that has not been made).
                  A confident mistranslation passes every downstream gate;
                  ambiguity must surface here or nowhere.

              (b) The item is clear, but its criteria CANNOT be expressed as
                  failing tests with the harness this repo actually has. Check
                  what exists before concluding this — AGENTS.md documents the
                  test harness, and the repo may have gained a capability since
                  you last looked. If a criterion needs something absent (a way
                  to render a component, a way to assert computed styles, a
                  browser API with no stand-in), that is this case.

              To take either path you MUST put a line reading exactly

                  AMBIGUOUS: <one line: what is unclear, or what is missing>

              in the spec. Name the specific thing. "Cannot render a component
              to assert aria-busy" tells a human what to build; "unclear" tells
              them nothing and costs another cycle.

              You MUST also end the spec with this section, filled in. The run
              fails without it, because a block that does not state its question
              is a block someone has to investigate:

                  ## DECISION NEEDED
                  **Question:** <one sentence, answerable without reading anything else>
                  **Options:** (a) <option> (b) <option>
                  **Recommendation:** <your view, one line of reasoning>
                  **To resume:** ./scripts/factory/resume.sh ${{ github.event.issue.number }} needs-spec

              The question is the whole point. "See the spec above" is not a
              question. "Should the strip claim FCA authorisation for motko, or
              name TrueLayer as the authorised institution?" is one: a human can
              answer it in a sentence without opening anything.

              That line is what stops the pipeline and marks the item blocked,
              and it is also what SAVES YOUR WORK: with it, the spec is
              committed and opened as a draft PR for a human to act on. Without
              it, a spec with no tests is treated as a malfunction — the run
              fails and nothing is pushed, so the spec you just wrote is thrown
              away. Never omit the tests silently. There is no third option.

            Finally, write a short section at the end of the spec titled
            "Derived criteria" — a plain-language checklist of what you
            understood the human to be asking for. This is read at review time.

      # The PM owes two artefacts, and until this step they were never counted.
      # `git add -A` stages whatever happens to exist and `git diff --cached
      # --quiet` only asks "did anything change at all" — a spec on its own
      # satisfies it. That is how #81 shipped a spec with no acceptance tests:
      # the run went green, the engineer implemented against nothing, and the
      # tests had to be added by hand afterwards, tripping the
      # acceptance-test-immutability guard on the PR.
      - name: Verify the PM produced both artefacts
        id: artefacts
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          BEFORE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          SPEC="docs/specs/$ISSUE.md"

          # Either extension counts. A component acceptance test has to be
          # .tsx, because JSX does not compile in a .ts file — so demanding
          # .test.ts made the contract unsatisfiable for exactly the UI items
          # the DOM harness was built to serve, and the run was discarded as a
          # malfunction. The resolved path is exported so the step that runs
          # the tests uses the file that actually exists.
          TESTS=""
          for CANDIDATE in "tests/acceptance/$ISSUE.test.ts" \
                           "tests/acceptance/$ISSUE.test.tsx"; do
            if [ -f "$CANDIDATE" ]; then TESTS="$CANDIDATE"; break; fi
          done
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

          if [ -z "$BEFORE_SHA" ]; then
            echo "::error::No baseline commit was recorded before the agent ran, so whether it did any work cannot be answered. Refusing to guess."
            exit 1
          fi

          # Work counts whether the agent left it staged or committed it. Both
          # are "the artefacts exist"; only the two together mean nothing
          # happened. Asking the index alone declared a committed spec a
          # malfunction and threw it away — see the baseline step above.
          git add -A
          git diff --cached --quiet && STAGED=0 || STAGED=1
          AFTER=$(git rev-parse HEAD)

          if [ "$STAGED" = "0" ] && [ "$AFTER" = "$BEFORE_SHA" ]; then
            {
              echo "PM agent produced no changes — nothing committed and nothing left staged. Marking blocked."
              scripts/factory/decision-section.sh "$ISSUE" needs-spec \
                "Re-run the PM on this item as-is, or does the roadmap item need sharpening first?" \
                "(a) re-run the PM unchanged (b) sharpen the Notion item, then re-run" \
                "(a) once. A PM that produces nothing has usually hit a transient fault rather than an unbuildable item; if a second run also produces nothing, the item is the problem."
            } > /tmp/pm-decision.md
            gh issue comment "$ISSUE" --body-file /tmp/pm-decision.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$SPEC" ]; then
            echo "::error::PM agent committed changes but wrote no spec at $SPEC."
            {
              echo "PM agent wrote no spec at \`$SPEC\`, though it changed something else. Nothing was pushed. Marking blocked."
              echo
              echo "What it did write:"
              echo '```'
              git diff --cached --name-only | head -20
              echo '```'
              scripts/factory/decision-section.sh "$ISSUE" needs-spec \
                "The PM changed files but wrote no spec — re-run it, or is the item asking for something that is not a spec?" \
                "(a) re-run the PM unchanged (b) rewrite the Notion item to describe a change, not a question" \
                "(a). Check the file list above first: if it wrote application code, the item is probably phrased as a task rather than a behaviour, which is (b)."
            } > /tmp/pm-decision.md
            gh issue comment "$ISSUE" --body-file /tmp/pm-decision.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -z "$TESTS" ]; then
            # Ambiguity is the one legitimate reason for a spec with no tests,
            # and the agent has to say so in the spec to claim it. Matched
            # leniently: an agent writing markdown may reach for `**AMBIGUOUS:**`
            # or `## AMBIGUOUS:`, and treating correct behaviour as a
            # malfunction over bold markers costs a whole cycle.
            if grep -qE '^[[:space:]>*_#]*AMBIGUOUS:' "$SPEC"; then
              echo "outcome=ambiguous" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # The spec is quoted into the issue before the run dies. Nothing is
            # pushed on this path, so the file is about to be destroyed with the
            # runner — three separate diagnoses this week had to infer what the
            # PM produced because the evidence was deleted. The listing matters
            # as much as the spec: a test written to an unexpected path looks
            # identical to no test at all from the outside.
            {
              echo "**PM agent produced a spec with no acceptance tests**, and the spec declares no \`AMBIGUOUS:\` line. Nothing was pushed. Marking blocked."
              echo
              echo "Expected \`tests/acceptance/$ISSUE.test.ts\` or \`tests/acceptance/$ISSUE.test.tsx\`. What it actually wrote there:"
              echo
              echo '```'
              ls -1 tests/acceptance/ 2>/dev/null || echo "(no tests/acceptance directory)"
              echo '```'
              echo
              echo "<details><summary>The spec it wrote (preserved here — this path pushes nothing, so the file is otherwise lost)</summary>"
              echo
              echo '```markdown'
              head -c 8000 "$SPEC"
              echo
              echo '```'
              echo
              echo "</details>"
              scripts/factory/decision-section.sh "$ISSUE" needs-spec \
                "Should this item be re-run, or can its criteria genuinely not be expressed as tests with the harness we have?" \
                "(a) re-run the PM unchanged (b) build the missing test capability first (c) rewrite the item's criteria to something testable" \
                "(a). The listing above shows what it actually wrote — if a test is there under an unexpected name, the run was fine and the guard was wrong. Take (b) only if the spec names a capability the harness lacks."
            } > /tmp/pm-blocked.md

            echo "::error::PM agent wrote $SPEC but no acceptance tests for #$ISSUE, and did not declare the item ambiguous."
            gh issue comment "$ISSUE" --body-file /tmp/pm-blocked.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "outcome=proceed" >> "$GITHUB_OUTPUT"

      # "Tests must fail for the right reason before implementation" was a rule
      # the prompt stated and nothing checked. Only a pass is treated as proof
      # of a problem: acceptance tests that already pass against the current
      # tree cannot be describing behaviour the Engineer has yet to build. A
      # non-zero exit for any other reason (missing module the Engineer will
      # add, compile error) is the expected pre-implementation state and is not
      # second-guessed here.
      # The acceptance tests are frozen after this run — the Engineer may not
      # touch them — so a test that fails lint or typecheck cannot be repaired
      # downstream. It reaches the Engineer, gets implemented against, and then
      # dies at the gate with an error nobody downstream is allowed to fix.
      # #132, #145 and #149 all blocked that way in one night: two on
      # `const module = await import(...)`, which Next rejects outright, and one
      # on a plain type error in the test. The prompt now warns about both, but
      # the prompt is advice and this is the check.
      - name: Acceptance tests must pass lint and typecheck
        if: steps.artefacts.outputs.outcome == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TESTS: ${{ steps.artefacts.outputs.tests }}
        run: |
          FAILED=0
          npx eslint "$TESTS" > /tmp/pm-lint.log 2>&1 || FAILED=1
          npm run typecheck > /tmp/pm-tsc.log 2>&1 || FAILED=1
          [ "$FAILED" = "0" ] && { echo "Acceptance tests lint and typecheck cleanly."; exit 0; }

          {
            echo "**The acceptance tests do not pass lint or typecheck**, so they cannot go to the Engineer — the immutability guard means nothing downstream is allowed to fix them. Nothing was pushed. Marking blocked."
            echo
            echo "\`\`\`"
            grep -E "error|Error" /tmp/pm-lint.log | head -20
            grep -E "error TS" /tmp/pm-tsc.log | grep "$ISSUE.test" | head -20
            echo "\`\`\`"
            echo
            echo "<details><summary>The spec it wrote (preserved — this path pushes nothing)</summary>"
            echo
            echo '```markdown'
            head -c 6000 "docs/specs/$ISSUE.md"
            echo
            echo '```'
            echo
            echo "</details>"
            scripts/factory/decision-section.sh "$ISSUE" needs-spec \
              "Re-run the PM so it writes a lint-clean test, or fix the test by hand on the branch?" \
              "(a) re-run the PM (b) fix the test by hand, folding it into the branch's first commit" \
              "(a). The prompt now names the traps that cause this, so a re-run usually clears it — and a hand fix costs a history rewrite, because only the first commit may touch tests/acceptance/."
          } > /tmp/pm-lintfail.md

          echo "::error::Acceptance tests for #$ISSUE fail lint or typecheck."
          gh issue comment "$ISSUE" --body-file /tmp/pm-lintfail.md
          gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
          exit 1

      - name: Acceptance tests must fail before implementation
        if: steps.artefacts.outputs.outcome == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Through the step output, not a shell variable: each step runs in its
          # own shell, so the TESTS resolved above is gone by here. An empty
          # value would hand vitest no path, run the entire suite, see it pass,
          # and block the item for "acceptance tests pass before implementation".
          TESTS: ${{ steps.artefacts.outputs.tests }}
        run: |
          if [ -z "$TESTS" ]; then
            echo "::error::No resolved acceptance test path — refusing to run the whole suite."
            exit 1
          fi

          if npx vitest run "$TESTS" > /tmp/acceptance.log 2>&1; then
            echo "::error::Acceptance tests for #$ISSUE pass against the unmodified tree."
            tail -40 /tmp/acceptance.log
            {
              echo "**PM agent's acceptance tests pass against the tree as it stands**, before any implementation, so they cannot be testing the behaviour this item asks for. Nothing was pushed. Marking blocked."
              echo
              echo '```'
              tail -25 /tmp/acceptance.log
              echo '```'
              scripts/factory/decision-section.sh "$ISSUE" needs-spec \
                "Do the tests pass because the behaviour already exists, or because they assert something too weak to fail?" \
                "(a) the behaviour already exists — close the item as already done (b) the tests are too weak — re-run the PM (c) the item describes something unobservable, so re-scope it" \
                "(b) is the common case; check the assertions above first. If (a), close it rather than building it twice."
            } > /tmp/pm-passing.md
            gh issue comment "$ISSUE" \
              --body-file /tmp/pm-passing.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
            exit 1
          fi
          echo "Acceptance tests fail before implementation, as required."

      - name: Commit, push and open draft PR
        if: steps.artefacts.outputs.outcome == 'proceed' || steps.artefacts.outputs.outcome == 'ambiguous'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Through the environment, not interpolated into the script: an issue
          # title is free text and a quote in it would break the command.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OUTCOME: ${{ steps.artefacts.outputs.outcome }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # `git commit` on an empty index is an error, and the index is empty
          # whenever the agent committed its own work. Both paths below commit
          # only if there is something to commit; the agent's own commit stands
          # as the branch's first commit either way, which is what the
          # immutability guard cares about — it keys on which files each commit
          # touches, not on the message.
          commit_if_staged() {
            if git diff --cached --quiet; then
              echo "Agent committed its own work; nothing left to stage."
            else
              git commit -q -m "$1"
            fi
          }

          if [ "$OUTCOME" = "ambiguous" ]; then
            commit_if_staged "spec: #$ISSUE is ambiguous — no acceptance tests"
            git push origin "$BRANCH"
            gh pr create --draft --base main --head "$BRANCH" \
              --title "Factory #$ISSUE (ambiguous): $ISSUE_TITLE" \
              --body "The PM agent judged #$ISSUE too ambiguous to translate and wrote no acceptance tests. The spec states what is unclear. This needs a human to sharpen the Notion item; the pipeline is stopped here deliberately."
            # The agent owns this decision section: only it knows what was
            # unclear. A block that arrives without one is a block a human has
            # to investigate, which is the thing this layer exists to remove —
            # so its absence fails the run loudly rather than passing quietly.
            if ! grep -q '^## DECISION NEEDED' "docs/specs/$ISSUE.md"; then
              echo "::error::PM declared #$ISSUE ambiguous but wrote no '## DECISION NEEDED' section in the spec. A block must arrive as an answerable question."
              {
                echo "PM agent judged this item ambiguous but did not state the decision it needs, so this block cannot be actioned without reading the spec. That is a factory fault, not an item fault."
                scripts/factory/decision-section.sh "$ISSUE" needs-spec \
                  "The PM declared this item ambiguous but did not say what it needs decided — re-run it, or read the spec on the branch and decide from there?" \
                  "(a) re-run the PM: the prompt requires the section, so a second run usually produces it (b) read the spec and answer its ambiguity directly, then sharpen the Notion item" \
                  "(a) once. If a second run also omits the section, the PM prompt is not landing and that is a factory fault to fix, not an item to keep retrying."
              } > /tmp/pm-nosection.md
              gh issue comment "$ISSUE" --body-file /tmp/pm-nosection.md
              gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
              exit 1
            fi

            {
              echo "PM agent judged this item ambiguous and wrote no acceptance tests, as instructed. The spec states what is unclear — see the draft PR. Marking blocked rather than guessing."
              echo
              sed -n '/^## DECISION NEEDED/,$p' "docs/specs/$ISSUE.md"
            } > /tmp/pm-ambiguous.md
            gh issue comment "$ISSUE" --body-file /tmp/pm-ambiguous.md
            gh issue edit "$ISSUE" --add-label blocked --remove-label needs-spec
            exit 0
          fi

          commit_if_staged "spec: derive spec and acceptance tests for #$ISSUE"
          git push origin "$BRANCH"
          gh pr create --draft \
            --base main --head "$BRANCH" \
            --title "Factory #$ISSUE: $ISSUE_TITLE" \
            --body "Closes #$ISSUE. Spec and acceptance tests derived by the PM agent."

      - name: Flag migrations for individual review
        if: steps.artefacts.outputs.outcome == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Three dots, so a migration that landed on main while this item was
          # being specced is not attributed to this item.
          if git diff --name-only origin/main...HEAD | grep -q "^supabase/migrations/"; then
            gh issue edit "$ISSUE" --add-label needs-migration
          fi

      # Gated on the artefact check: this previously ran unconditionally, so the
      # "no changes" path marked the item blocked and then immediately advanced
      # it to spec-derived, starting the Engineer on a branch with nothing on it.
      - name: Advance state
        if: steps.artefacts.outputs.outcome == 'proceed'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --remove-label needs-spec --add-label spec-derived
