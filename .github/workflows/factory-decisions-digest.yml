name: Factory — decisions digest

# Every blocked item ends its comment with a DECISION NEEDED section. This
# gathers them into one place every morning, so the question of "what is the
# factory waiting on me for" is answered by reading one issue rather than by
# opening every blocked item and reconstructing its state from comments, logs
# and sometimes the diff.
#
# It posts on quiet days too. A digest that goes silent when there is nothing
# pending is indistinguishable from a digest that has broken, and the second is
# the case you need to know about.
on:
  schedule:
    # 07:00 UTC is 08:00 UK during BST. It drifts to 07:00 UK in winter; that is
    # accepted rather than solved, because GitHub's scheduler has no timezone
    # and an hour's drift on a morning digest costs nothing.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: factory-decisions-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect blocked items and post the digest
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRACKER: "157"
        run: |
          set -euo pipefail

          # factory-meta is excluded so the tracker can never appear in its own
          # digest, and neither can any future bookkeeping issue.
          # Both stopped states, not just `blocked`. A qa-disputed item is
          # stopped and waiting on a human exactly as a blocked one is — it is
          # the Engineer saying QA is wrong, which is a question by definition.
          # Collecting only `blocked` made every dispute invisible to the daily
          # digest: #119 sat disputed for hours without appearing, and #132
          # before it. Two items is a pattern, not an oversight.
          # A third stopped state, and it is stopped for a different reason than
          # the other two. `blocked` and `qa-disputed` are a consumer saying it
          # cannot go on; `reconciler-escalated` is the reconciler saying the
          # observed state does not determine what should happen next. Both need
          # a human, so both belong here — but they are kept as separate labels
          # because "the Engineer stopped and asked" and "nothing can tell where
          # this item is" are different problems and get different answers.
          BLOCKED=$(gh issue list --label blocked --state open --limit 100 --json number,title,labels)
          DISPUTED=$(gh issue list --label qa-disputed --state open --limit 100 --json number,title,labels)
          ESCALATED=$(gh issue list --label reconciler-escalated --state open --limit 100 --json number,title,labels)
          ISSUES=$(printf '%s\n%s\n%s' "$BLOCKED" "$DISPUTED" "$ESCALATED" \
                     | jq -s 'add | unique_by(.number)
                              | [.[] | select([.labels[].name] | index("factory-meta") | not)]')
          COUNT=$(printf '%s' "$ISSUES" | jq 'length')

          # The stopped states are not the only way an item stops. An item
          # carrying a live stage label is claiming a workflow is working on it,
          # and when that claim goes stale nothing says so: the digest reads
          # only `blocked` and `qa-disputed`, so the item is invisible to the one
          # report that exists to make waiting work visible.
          #
          # This is not hypothetical and it is not rare. #140, #171, #185 and
          # #188 have carried `verify` since 12 August and #148 has carried
          # `needs-spec` since the same day — five items, none of them in any
          # digest, one (#188) with no comment on it at all. They were stranded
          # by a silent-failure path that PR #192 closed at 20:54 that evening,
          # and there the fix ended: it changed what happens NEXT time and
          # nothing went back for the items already stuck. Every forward-only
          # repair leaves a cohort like this behind, so the sweep is permanent
          # rather than a one-off cleanup.
          # Retained as a BACKSTOP behind the reconciler, which sweeps every 15
          # minutes and acts rather than reports. Anything still visible here is
          # something the reconciler did not pick up — either it is not running,
          # or the item is invisible to it — and that is worth knowing on its own.
          STALE_HOURS="${STALE_HOURS:-6}"
          CUTOFF=$(date -u -d "-${STALE_HOURS} hours" '+%Y-%m-%dT%H:%M:%SZ')
          STALLED=$(gh issue list --label factory --state open --limit 200 \
                      --json number,title,labels,updatedAt \
                    | jq --arg cutoff "$CUTOFF" '
                        [ .[]
                          | select([.labels[].name] | index("factory-meta") | not)
                          # Already reported above; this is for items that stopped
                          # WITHOUT reaching a stopped state.
                          | select([.labels[].name]
                                   | (index("blocked") or index("qa-disputed")
                                      or index("reconciler-escalated")) | not)
                          # A stage label is a claim that a workflow has this item.
                          | select([.labels[].name]
                                   | (index("needs-spec") or index("spec-derived")
                                      or index("verify") or index("qa-changes")))
                          | select(.updatedAt < $cutoff)
                          | { number, title,
                              stage: ([.labels[].name]
                                      | map(select(. == "needs-spec" or . == "spec-derived"
                                                   or . == "verify" or . == "qa-changes"))
                                      | join(", ")),
                              updatedAt }
                        ] | sort_by(.updatedAt)')
          STALLED_COUNT=$(printf '%s' "$STALLED" | jq 'length')

          {
            echo "## Decisions pending — $(date -u '+%A %-d %B %Y')"
            echo

            if [ "$COUNT" = "0" ]; then
              # Qualified rather than absolute. "Nothing is waiting on a human"
              # is a claim about the whole factory, and the stalled sweep below
              # can contradict it — saying it anyway is how five items stayed
              # invisible for three days under a digest reporting all clear.
              if [ "$STALLED_COUNT" = "0" ]; then
                echo "No decisions pending. Nothing in the factory is waiting on a human."
              else
                echo "No decisions pending, but see the stalled items below — they are stopped without having asked anything."
              fi
            else
              echo "$COUNT item(s) blocked and waiting on you."
              echo

              for N in $(printf '%s' "$ISSUES" | jq -r '.[].number'); do
                TITLE=$(printf '%s' "$ISSUES" | jq -r --argjson n "$N" '.[] | select(.number==$n) | .title')
                echo "### #$N — $TITLE"

                # The most recent comment carrying a section wins: an item
                # blocked, resumed and blocked again has several, and the oldest
                # describes a decision that has already been taken.
                SECTION=$(gh issue view "$N" --json comments \
                  --jq '[.comments[] | select(.body | test("## DECISION NEEDED"))] | last | .body // ""' \
                  | sed -n '/## DECISION NEEDED/,$p')

                if [ -z "$SECTION" ]; then
                  echo "_No DECISION NEEDED section found._ This item blocked without stating its question, which is a factory fault — the blocking path that produced it needs fixing."
                  echo
                  echo "- Issue: ${{ github.server_url }}/${{ github.repository }}/issues/$N"
                else
                  printf '%s\n' "$SECTION" \
                    | grep -E '^\*\*(Question|Recommendation|Fixes outside my permissions|To resume):\*\*' \
                    | sed 's/^/- /'
                fi
                echo
              done
            fi

            if [ "$STALLED_COUNT" != "0" ]; then
              echo "## Stalled — no stopped-state label"
              echo
              echo "$STALLED_COUNT item(s) still carry a stage label but nothing has touched them for over ${STALE_HOURS}h. Each is claiming a workflow has it, and none does. These do not appear above because they were never marked \`blocked\` or \`qa-disputed\` — which is the bug, not the reason to leave them out."
              echo

              printf '%s' "$STALLED" | jq -r --arg base "${{ github.server_url }}/${{ github.repository }}/issues" \
                '.[] | "- [#\(.number)](\($base)/\(.number)) — \(.title)\n  - Stuck at: `\(.stage)`, last activity \(.updatedAt)"'
              echo
              echo "Pick the stage each one should re-enter and resume it: \`./scripts/factory/resume.sh <issue> <stage>\`. Check the branch before choosing — if the acceptance tests already pass, the stage is \`verify\`, not \`spec-derived\`."
              echo
            fi

            echo "---"
            echo "_Posted by the decisions digest. Stage guidance is in \`scripts/factory/resume.sh\`; the trap is that \`spec-derived\` on finished work re-runs the Engineer, finds nothing to do, and blocks again._"
          } > /tmp/digest.md

          gh issue comment "$TRACKER" --body-file /tmp/digest.md
          echo "Digest posted to #$TRACKER ($COUNT pending, $STALLED_COUNT stalled)."
