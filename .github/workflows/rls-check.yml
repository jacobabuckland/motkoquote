name: Live checks (production credentials)

# The lane for every check that asserts something about PRODUCTION rather than
# about this tree, and therefore needs real credentials. Two things live here:
#
#   src/checks/rls.check.test.ts   every public table has row level security
#   src/checks/function-privileges.check.test.ts
#                                  no SECURITY DEFINER function is callable by
#                                  anon/authenticated/PUBLIC unless allowlisted
#   src/checks/object-inventory.check.test.ts
#                                  production's public schema matches the
#                                  manifest committed in this tree
#   tests/integration/**           behaviour against a real database, e.g.
#                                  #244's cross-tenant isolation tests
#
# The two surface checks were added on 31 Aug after settle_fee_collection was
# found on production: SECURITY DEFINER, callable by anon, able to mark fees
# collected and clear a billing hold. It was in no migration and called by no
# code, and had been live for weeks with every gate green. This lane checked
# tables; nothing checked functions, privileges, or whether an object on prod
# came from this repository at all.
#
# Neither belongs in the unit-test suite, and both are excluded from it in
# vitest.config.ts. One lane rather than two: the constraint is identical, and
# two mechanisms for the same constraint is how one of them rots unnoticed.
#
# Integration tests skip themselves when the key is absent. That is why they
# cannot stay in the gate: there they reported as coverage while never running,
# which is harder to spot than the placeholder assertions they replaced.
#
# It needs a service-role key, and the CI gate must not have one: this
# repository is public, so its Actions logs are world-readable and a
# service-role key in every pull-request run is a credential leak waiting to
# happen. Running it here instead keeps the check alive without putting that key
# on the PR path — and keeps it off the PR path in the other direction too, so a
# production RLS gap does not block unrelated work from merging.
#
# It fails loudly rather than skipping. A check with no runner has quietly
# stopped existing, which is worse than one that fails: #221 exists precisely
# because cron_locks sat without RLS and nothing said so.
on:
  schedule:
    # 06:30 UTC, before the decisions digest at 07:00, so a failure here is
    # already visible by the time anyone reads the morning digest.
    - cron: "30 6 * * *"
  workflow_dispatch:

# Filename kept as rls-check.yml on purpose: renaming a workflow starts its
# run history over, and the history of this one is the record of whether
# production RLS has held.
concurrency:
  group: rls-check
  cancel-in-progress: false

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run every check that needs production credentials
        env:
          # URL and publishable key are PUBLIC by design — both are served to
          # every browser in the client bundle (src/lib/supabase/client.ts), so
          # writing them here exposes nothing that visiting the site does not.
          # A repository secret still wins where one is set, so rotating either
          # does not mean editing this file, and pointing the lane at a staging
          # project is a secret away.
          #
          # SUPABASE_SERVICE_ROLE_KEY has no default and never will. It bypasses
          # RLS entirely, this repository is public, and its Actions logs are
          # world-readable.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ldapggtjnvjnabvzcebj.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The anon key is not optional here. An RLS test cannot be written
          # with the service-role key alone: that key bypasses RLS by design, so
          # a test using only it proves the WHERE clause, not the policy. The
          # cross-tenant tests build a second, anon-key client authenticated as
          # the other contractor, and that client is the thing under test.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_-lIxUmlvejJy_6xKMT6kgQ_WfvTXnD0' }}
        run: |
          # All three, named individually. The tests' own skipIf guard checks
          # only the URL and the service-role key, so a missing anon key does
          # not skip them — they run and fail on an undefined key, which reads
          # as a broken test rather than as missing configuration.
          # A loop rather than three `[ -z X ] && MISSING=...` lines, for
          # readability only — that form is safe under `bash -e`, which exempts
          # every command of an AND-OR list except the last.
          MISSING=""
          for VAR in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Not set:$MISSING — so the RLS state of production is unknown and no live integration test ran. That is a fact about this workflow's configuration, not an all-clear: add the secrets rather than reading a skipped check as a pass."
            exit 1
          fi
          # Its own config, not `--exclude` and not a named file. vitest's
          # `--exclude` APPENDS to the config's exclude list rather than
          # replacing it, and a named file that the config excludes is still
          # excluded — so the obvious spelling runs nothing, exits non-zero with
          # "No test files found", and the next person makes it non-fatal.
          npx vitest run --config vitest.live.config.ts

      # The schema probe belongs in this lane too, and for the same reason the
      # header gives: it asserts something about PRODUCTION rather than about
      # this tree, and a check with no runner has quietly stopped existing.
      #
      # It has one on the PR path, but that one cannot fail usefully — the
      # credentials may legitimately be absent on a fork, and blocking every PR
      # on a check nobody has configured is what tests/acceptance/225.test.ts
      # froze the skip path to prevent. So the PR lane warns, and refuses only a
      # PR that carries a migration. THIS is where it can fail loudly, because
      # nothing is waiting on it.
      #
      # It also catches what no PR-triggered probe ever will: drift from a
      # migration applied to production by hand, with no pull request at all.
      # That is the normal way migrations reach prod here — `supabase db push`,
      # run by a human — so it is not a corner case.
      - name: Schema drift against production
        # `always()` so a failure of the RLS step above does not hide this one.
        # Two independent facts about production; one being unknown must not
        # make the other unknown too.
        if: always()
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          # The probe diffs against the base branch to find what changed. On a
          # schedule there is no PR, so it compares main against itself and
          # examines the whole tree's schema references.
          GITHUB_BASE_REF: main
        run: |
          MISSING=""
          for VAR in SUPABASE_READONLY_URL SUPABASE_READONLY_KEY; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Not set:$MISSING — so schema-drift-probe has never run and the schema state of production is unknown. It reports SUCCESS on every pull request while doing nothing, which is worse than failing: it is the assurance a reader goes looking for after CLAUDE.md tells them the migration ledger alone is not proof. Add the secrets rather than reading a skipped check as a pass."
            exit 1
          fi
          npx tsx scripts/ci/schema-probe.ts
