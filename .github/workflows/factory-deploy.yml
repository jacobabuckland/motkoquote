name: Factory — Deploy to Preview

on:
  issues:
    types: [labeled]

concurrency:
  group: factory-${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.label.name == 'previewed' &&
      !contains(github.event.issue.labels.*.name, 'factory-meta')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Needed only for scripts/factory/notion-page-id.sh, which resolves the
      # roadmap page this item belongs to.
      - uses: actions/checkout@v4

      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --head "factory/${{ github.event.issue.number }}" \
                 --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "::error::No PR found for factory/${{ github.event.issue.number }}"
            exit 1
          fi
          gh pr ready "$PR"
          echo "PR=$PR" >> "$GITHUB_ENV"

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          BRANCH: factory/${{ github.event.issue.number }}
        run: |
          URL=""
          LAST_STATE=""
          for i in $(seq 1 40); do
            # Vercel registers its GitHub deployments against the commit SHA,
            # never the branch name, so `?ref=` has to be given a SHA —
            # `?ref=factory/81` matches nothing and waits out the full timeout.
            # Re-resolved every pass so a commit pushed mid-wait is picked up
            # rather than ignored in favour of a stale SHA.
            SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true)

            if [ -n "$SHA" ]; then
              # Newest first, and every one of them is checked: a rebuild leaves
              # the older failed deployment on the same SHA, so looking only at
              # .[0] can settle on a failure that a later build superseded.
              for id in $(gh api \
                    "repos/$REPO/deployments?ref=$SHA&environment=Preview&per_page=20" \
                    --jq '.[].id' 2>/dev/null || true); do
                STATUSES=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                             2>/dev/null || echo '[]')
                # Only a success counts, and only one carrying a real URL —
                # Vercel sets environment_url on failures too.
                FOUND=$(printf '%s' "$STATUSES" | jq -r \
                  '[.[] | select(.state == "success") | .environment_url
                    | select(. != null and . != "")] | .[0] // empty')
                if [ -n "$FOUND" ]; then URL="$FOUND"; break; fi
                STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
                if [ -n "$STATE" ]; then LAST_STATE="$STATE"; fi
              done
            fi

            if [ -n "$URL" ]; then break; fi
            echo "Waiting for preview deployment... ($i/40, last status: ${LAST_STATE:-none})"
            sleep 15
          done

          if [ -z "$URL" ]; then
            echo "::warning::No successful preview deployment after 10 minutes (last status: ${LAST_STATE:-none})."
            URL="(preview not available — check Vercel)"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # This comment is the last thing a human reads before batch-confirming, so
      # the migration flag is derived from the branch here rather than trusted
      # to have been applied upstream. The PM sets the label at spec time and
      # the Engineer sets it at push time; if both missed it (a migration the
      # spec did not foresee, an upstream step that never ran) this is the point
      # at which a silent miss becomes a migration inside a batch approval.
      - name: Announce, and flag if a migration needs individual review
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: factory/${{ github.event.issue.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR: ${{ env.PR }}
        run: |
          # Loud on failure, never a quiet "no migration": an unanswerable
          # question here must not read as a clean answer.
          if ! FILES=$(gh api --paginate "repos/$REPO/compare/main...$BRANCH" \
                         --jq '.files[].filename'); then
            echo "::error::Could not compare main...$BRANCH to check for migrations."
            exit 1
          fi

          NOTE=""
          if printf '%s\n' "$FILES" | grep -q "^supabase/migrations/"; then
            gh issue edit "$ISSUE" --add-label needs-migration
            NOTE="

          **This item contains a database migration.** It requires individual human review before the batch is confirmed. Do not batch-approve it. Apply it to production with \`supabase db push\` before merging — schema precedes code, and nothing in this pipeline applies it for you."
          fi

          gh issue comment "$ISSUE" \
            --body "**Ready for review**

          Preview: $PREVIEW_URL
          PR: #$PR

          Awaiting batch confirmation to main.$NOTE"

      # A "Smoke-test the preview" step used to dispatch deploy-health-check.yml
      # here. It was removed on 4 Sep 2026 — see FACTORY.md. It could not pass:
      # its credentials were never set, and Vercel deployment protection
      # answered 302 to every unauthenticated path before the request reached
      # the app. So it commented "the deployment will not be promoted to
      # production" on every factory item, always, next to green gates and QA
      # passes. A warning that fires on everything is worse than none.

      # Last, deliberately: a Notion failure is a hard error, and running it
      # after the announce means that failure can never suppress the
      # human-facing comment that the preview is ready.
      - name: Write the preview URL back to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # Through the environment, never interpolated into the script body:
          # the issue body is free text that routinely contains quotes and
          # newlines, which terminated the shell string outright.
          ISSUE_BODY: ${{ github.event.issue.body }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "::error::NOTION_API_KEY is not set — cannot write back to Notion."
            exit 1
          fi

          # The marker, falling back to the Source link when a card edit
          # dropped it — see scripts/factory/notion-page-id.sh.
          PAGE_ID=$(printf '%s' "$ISSUE_BODY" | scripts/factory/notion-page-id.sh || true)

          if [ -z "$PAGE_ID" ]; then
            echo "No Notion page id found in the issue body — skipping write-back."
            exit 0
          fi

          # Status is a `select` on the Roadmap database (not Notion's newer
          # `status` type) and "Previewed" is an existing option. Preview URL is
          # a `url` property, so when the wait step fell through to its
          # human-readable placeholder we clear the field rather than storing
          # prose in it.
          case "$PREVIEW_URL" in
            https://*)
              PAYLOAD=$(jq -n --arg url "$PREVIEW_URL" \
                '{properties: {Status: {select: {name: "Previewed"}},
                               "Preview URL": {url: $url}}}') ;;
            *)
              PAYLOAD=$(jq -n \
                '{properties: {Status: {select: {name: "Previewed"}},
                               "Preview URL": {url: null}}}') ;;
          esac

          CODE=$(curl -sS -o /tmp/notion-response.json -w '%{http_code}' \
            -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$CODE" != "200" ]; then
            echo "::error::Notion write-back failed (HTTP $CODE)"
            cat /tmp/notion-response.json
            exit 1
          fi
          echo "Notion page $PAGE_ID updated."
