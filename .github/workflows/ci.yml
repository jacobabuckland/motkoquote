name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Installing dependencies, and why `--no-audit` is the load-bearing flag
#
# Four jobs here paired `npm ci` with `timeout-minutes: 5`, and the install
# consumed the whole budget so the check after it never ran. GitHub reports a
# timed-out job as `cancelled`, not `failed`, so nothing treated it as a
# problem: the PR showed a grey circle and the guard was simply absent.
# `acceptance-test-immutability` (which stops an Engineer rewriting the contract
# it is judged against) and `migration-check` (which enforces
# schema-before-code) were both in that set, for weeks.
#
# The install was NOT slow because of the package work. The line immediately
# before the 5-minute figure, every time, was npm's audit notice:
#
#     npm notice This endpoint is being retired. Use the bulk advisory
#     endpoint instead. See ... #tag/Audit
#     added 717 packages in 5m
#
# `npm audit` calls a registry endpoint npm is retiring, and that call is what
# was hanging. With `--no-audit` the same install on the same runner, with the
# node_modules cache MISSING, completed in **16 seconds** (measured 4 Sep,
# schema-drift-probe on this PR). That is the fix.
#
# The node_modules cache below is belt-and-braces on top: it makes a genuinely
# cold runner cheap too, and costs nothing when it misses. Do not mistake it
# for the thing that solved this — the first run with it in place missed the
# cache and still took 16 seconds.
#
# `--no-fund` and `--prefer-offline` are noise reduction and a preference for
# the tarball cache that setup-node already keeps warm.

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check generated language
        run: node scripts/check-generated-language.mjs

      - name: Build
        run: npm run build

  acceptance-test-immutability:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # see the note on install caching above
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # The rule is unchanged — every commit after the spec commit that touches
      # tests/acceptance/ is a violation — with one narrow carve-out: a purely
      # additive entry to a named standing registry is registration, not repair
      # (see AGENTS.md). The logic lives in a script rather than inline here so
      # the carve-out is unit-tested; a guard whose rule cannot be exercised in
      # a test is a guard nobody can trust. See
      # tests/regression/acceptance-immutability-guard.test.ts.
      - name: Acceptance tests must only be written once, by the PM agent
        run: npx tsx scripts/ci/acceptance-immutability.ts "origin/${{ github.base_ref }}"

  # The same treatment as the acceptance tests, because the spec is the same
  # kind of thing: the contract the implementation is judged against. An
  # Engineer that can rewrite docs/specs/ can retire any spec-fidelity finding
  # by editing what it is measured by. Kept as its own job rather than folded
  # into acceptance-test-immutability so each failure names what actually
  # broke, and so the existing check name does not move.
  spec-immutability:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The spec must only be written once, by the PM agent
        run: |
          BASE=origin/${{ github.base_ref }}
          COMMITS=$(git rev-list --reverse "$BASE"..HEAD)
          FIRST=$(echo "$COMMITS" | head -n1)

          # Every commit after the first that touches docs/specs/ is a violation.
          VIOLATIONS=""
          for SHA in $COMMITS; do
            if [ "$SHA" = "$FIRST" ]; then continue; fi
            if git diff-tree --no-commit-id --name-only -r "$SHA" | grep -q "^docs/specs/"; then
              VIOLATIONS="$VIOLATIONS $SHA"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::The spec was modified after the spec commit. It is the contract this work is judged against — correct it at source (amend the PM's first commit, or re-derive from a sharpened roadmap item) rather than mid-branch."
            for SHA in $VIOLATIONS; do
              echo "--- $SHA ---"
              git show --stat "$SHA" -- docs/specs/
            done
            exit 1
          fi
          echo "Spec unmodified since the spec commit."

  # A factory branch is cut from main and reviewed against main, so it is
  # structurally blind to every sibling in flight. All four collisions in the
  # 16-17 August field review were mechanically detectable from the branches
  # themselves and none was detected, because nothing ever looked at more than
  # one branch at a time — each was found by whoever merged second, which is the
  # most expensive moment to find out. One reached production.
  cross-branch-collisions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # see the note on install caching above
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan is three-dot against the merge base, and a
          # shallow clone has no merge base to be three dots from.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Compare this branch against every other open factory branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: npx tsx scripts/ci/cross-branch-collisions.ts

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the diff for credentials
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          # Live-key prefixes require a key body to match. A bare `sk_live_`
          # is not a credential — it is how you write the guard that refuses
          # live keys outside production, and how a spec names one. Matching
          # the prefix alone failed PAY-2 on its own safety check, and would
          # have failed every later Stripe ticket the same way.
          PATTERNS='sk-ant-[a-zA-Z0-9]|sk_live_[A-Za-z0-9]{8,}|rk_live_[A-Za-z0-9]{8,}|ntn_[a-zA-Z0-9]|eyJhbGciOi|-----BEGIN [A-Z ]*PRIVATE KEY-----|service_role'

          if git diff "$RANGE" -- . ':(exclude).github/workflows/*' \
               | grep -E '^\+' | grep -Eq "$PATTERNS"; then
            echo "::error::Possible credential detected in the diff."
            git diff "$RANGE" | grep -E '^\+' | grep -En "$PATTERNS" | head -20
            exit 1
          fi
          echo "No credentials detected."

  migration-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # see the note on install caching above
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # The rule is unchanged — migrations must be additive — but it is applied
      # to SQL rather than to raw text. Grepping the whole file failed a
      # migration for documenting its own rollback in comments (#244, blocked
      # eighteen minutes after creation), and every LED item will document one.
      # The logic lives in a script so the stripper is unit tested; a guard whose
      # rule cannot be exercised in a test is a guard nobody can trust.
      - name: Migrations must be additive and reversible
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"..HEAD \
                    -- supabase/migrations/ || true)
          if [ -z "$FILES" ]; then
            echo "No migrations in this PR."
            exit 0
          fi

          echo "Migrations found:"
          echo "$FILES"
          echo

          # shellcheck disable=SC2086
          npx tsx scripts/ci/migration-safety.ts $FILES

  # The tree-only half of the schema question, and the half that actually runs.
  #
  # schema-drift-probe below asks PRODUCTION whether a column exists, which is
  # the check that matters and the one that would have caught #387 — and it has
  # never run, because both its secrets are unset. This needs no credentials, so
  # it runs on every PR: no select may name a column that no migration in the
  # tree creates.
  #
  # It is NOT a substitute for the probe and must never be read as one. A green
  # run here means the tree is internally consistent; it says nothing whatsoever
  # about what has been applied to production. The script prints that on every
  # run for the same reason.
  schema-in-tree:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # see the note on install caching above
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Every column a select names must exist in a migration
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/ci/check-schema-in-tree.ts

  schema-drift-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 5, and now genuinely enough. tests/acceptance/225.test.ts asserts this
    # job's timeout is <= 5 and that test is frozen, so it could not be raised —
    # which is what forced the real fix above rather than a bigger number.
    # Measured on this PR with the node_modules cache MISSING: install 16s,
    # whole job 28s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check for schema drift
        env:
          SUPABASE_READONLY_URL: ${{ secrets.SUPABASE_READONLY_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # Check if PR has any schema-relevant changes
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)

          # Skip if no migrations and no TypeScript/JavaScript files
          if ! echo "$FILES" | grep -Eq '(supabase/migrations/|\.tsx?$|\.jsx?$)'; then
            echo "No schema-relevant changes in this PR. Skipping probe."
            exit 0
          fi

          # Run the probe script
          npx tsx scripts/ci/schema-probe.ts 2>&1 | tee /tmp/probe.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" != "0" ]; then
            exit "$STATUS"
          fi

          # A green probe must never mean "not checked".
          #
          # The credentials are absent, so probe() skipped and returned 0 — a
          # frozen contract (tests/acceptance/225.test.ts) that deliberately
          # does not block every PR on a check nobody has configured. Fine for
          # a PR that touches no schema.
          #
          # Not fine for a PR carrying a MIGRATION. That is the one case
          # CLAUDE.md's schema-precedes-code rule exists for, where a green
          # probe reads as "the columns are on production" and is the assurance
          # a human goes looking for. #387 merged on exactly that misreading.
          if grep -q '::probe-skipped-unconfigured::' /tmp/probe.log; then
            # ADDED migrations only (--diff-filter=A), not every path under
            # supabase/migrations/ that the diff touches.
            #
            # The first version of this asked whether the diff mentioned the
            # directory at all, and so it fired on a REVERT that removes a
            # migration file — refusing the very PR that was restoring
            # production after the columns turned out to be missing. A PR that
            # deletes a migration is not asking production for new columns and
            # has nothing to verify.
            ADDED_MIGRATIONS=$(git diff --name-only --diff-filter=A \
                                 "origin/${{ github.base_ref }}"...HEAD \
                                 -- supabase/migrations/ || true)

            # A migration on its OWN is not the thing to refuse — it is the
            # correct move. "Schema precedes code" means the migration lands
            # first, is pushed, and is read back off production BEFORE any code
            # names the new columns. A guard that blocks a migration-only PR
            # forbids the very workflow it exists to enforce, and this one did:
            # it refused the PR reinstating migration 048 after that migration's
            # absence had already taken production down once.
            #
            # What is dangerous is a migration shipping WITH code that reads it,
            # which is what #387 did. So the refusal needs both.
            CODE_CHANGED=$(git diff --name-only \
                             "origin/${{ github.base_ref }}"...HEAD \
                             -- src/ || true)

            if [ -n "$ADDED_MIGRATIONS" ] && [ -n "$CODE_CHANGED" ]; then
              echo "::error title=Migration and code in one PR, with no way to verify::This PR adds a migration AND changes code, and schema-drift-probe has no credentials, so nothing confirmed the new columns exist on production. Split it: land the migration alone, push it, read the columns back off production, then land the code. Reporting that \`supabase db push\` ran is not the same as reading the column back — #387 shipped on exactly that and took every job page and every customer quote link down, because the push had been run from a checkout that did not contain the migration."
              exit 1
            fi
            if [ -n "$ADDED_MIGRATIONS" ]; then
              echo "::warning title=Migration added, not yet verified::This PR adds a migration and no code that reads it, which is the right order. Push it and read the columns back off production before landing anything that names them."
            fi
            echo "Probe did not run (no credentials). Nothing here pairs a new migration with code that reads it."
          fi
