name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  acceptance-test-immutability:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acceptance tests must only be written once, by the PM agent
        run: |
          BASE=origin/${{ github.base_ref }}
          COMMITS=$(git rev-list --reverse "$BASE"..HEAD)
          FIRST=$(echo "$COMMITS" | head -n1)

          # Every commit after the first that touches tests/acceptance/ is a violation.
          VIOLATIONS=""
          for SHA in $COMMITS; do
            if [ "$SHA" = "$FIRST" ]; then continue; fi
            if git diff-tree --no-commit-id --name-only -r "$SHA" | grep -q "^tests/acceptance/"; then
              VIOLATIONS="$VIOLATIONS $SHA"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Acceptance tests were modified after the spec commit."
            for SHA in $VIOLATIONS; do
              echo "--- $SHA ---"
              git show --stat "$SHA" -- tests/acceptance/
            done
            exit 1
          fi
          echo "Acceptance tests unmodified since the spec commit."

  # The same treatment as the acceptance tests, because the spec is the same
  # kind of thing: the contract the implementation is judged against. An
  # Engineer that can rewrite docs/specs/ can retire any spec-fidelity finding
  # by editing what it is measured by. Kept as its own job rather than folded
  # into acceptance-test-immutability so each failure names what actually
  # broke, and so the existing check name does not move.
  spec-immutability:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The spec must only be written once, by the PM agent
        run: |
          BASE=origin/${{ github.base_ref }}
          COMMITS=$(git rev-list --reverse "$BASE"..HEAD)
          FIRST=$(echo "$COMMITS" | head -n1)

          # Every commit after the first that touches docs/specs/ is a violation.
          VIOLATIONS=""
          for SHA in $COMMITS; do
            if [ "$SHA" = "$FIRST" ]; then continue; fi
            if git diff-tree --no-commit-id --name-only -r "$SHA" | grep -q "^docs/specs/"; then
              VIOLATIONS="$VIOLATIONS $SHA"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::The spec was modified after the spec commit. It is the contract this work is judged against — correct it at source (amend the PM's first commit, or re-derive from a sharpened roadmap item) rather than mid-branch."
            for SHA in $VIOLATIONS; do
              echo "--- $SHA ---"
              git show --stat "$SHA" -- docs/specs/
            done
            exit 1
          fi
          echo "Spec unmodified since the spec commit."

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the diff for credentials
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          # Live-key prefixes require a key body to match. A bare `sk_live_`
          # is not a credential — it is how you write the guard that refuses
          # live keys outside production, and how a spec names one. Matching
          # the prefix alone failed PAY-2 on its own safety check, and would
          # have failed every later Stripe ticket the same way.
          PATTERNS='sk-ant-[a-zA-Z0-9]|sk_live_[A-Za-z0-9]{8,}|rk_live_[A-Za-z0-9]{8,}|ntn_[a-zA-Z0-9]|eyJhbGciOi|-----BEGIN [A-Z ]*PRIVATE KEY-----|service_role'

          if git diff "$RANGE" -- . ':(exclude).github/workflows/*' \
               | grep -E '^\+' | grep -Eq "$PATTERNS"; then
            echo "::error::Possible credential detected in the diff."
            git diff "$RANGE" | grep -E '^\+' | grep -En "$PATTERNS" | head -20
            exit 1
          fi
          echo "No credentials detected."

  migration-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrations must be additive and reversible
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"..HEAD \
                    -- supabase/migrations/ || true)
          if [ -z "$FILES" ]; then
            echo "No migrations in this PR."
            exit 0
          fi

          echo "Migrations found:"
          echo "$FILES"

          FAILED=0
          for F in $FILES; do
            [ -f "$F" ] || continue
            if grep -Eiq 'DROP (TABLE|COLUMN|SCHEMA)|TRUNCATE|DELETE FROM' "$F"; then
              echo "::error file=$F::Destructive statement found. Migrations must be additive."
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "::notice::Migrations present — this PR requires individual human review."
