name: Factory — Poll Notion

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Poll Notion for ready items
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/factory/poll-notion.mjs
