name: Factory — Poll Notion

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # FACTORY_MAX_PER_RUN below bounds the RATE work is admitted at. It says
      # nothing about the STOCK already stopped, and the factory jams on the
      # stock: every stopped item waits on the same single human, so a pipeline
      # whose only exit is that human fills up regardless of how small the rate
      # is. Between 11 and 15 August the poller admitted every item Notion
      # offered while the stopped queue went 5 → 12 and merges went to zero. The
      # rate limit was working exactly as designed and the queue still ran away.
      #
      # This lives in the workflow rather than in poll-notion.mjs on purpose.
      # Admission control is a policy about the factory's state, not part of
      # reading Notion — and #115's acceptance tests pin the script's request
      # sequence, so a new call inside main() breaks a frozen contract to no
      # benefit. Every other factory gate is a shell step; so is this one.
      - name: Refuse to admit work while the queue is already stopped
        id: gate
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Five is roughly a morning's worth of decisions. Above it, admitting
          # more is not throughput — it is queue that will be stale before
          # anyone reaches it.
          MAX_BLOCKED: "5"
        run: |
          set -euo pipefail

          # Every stopped state. `blocked` is a question asked of a human;
          # `qa-disputed` is the Engineer saying QA is wrong; `spec-dispute` is
          # the Engineer saying the contract is wrong; `reconciler-escalated` is
          # the reconciler saying it cannot tell where the item is. None moves on
          # its own and all four wait on the same person, so all four count
          # against the ceiling — a state that stops an item but does not count
          # is how the ceiling stops meaning anything.
          # Repeated --label is an AND, so these are factory items specifically.
          BLOCKED=$(gh issue list --label factory --label blocked \
                      --state open --limit 100 --json number)
          DISPUTED=$(gh issue list --label factory --label qa-disputed \
                       --state open --limit 100 --json number)
          SPEC_DISPUTED=$(gh issue list --label factory --label spec-dispute \
                            --state open --limit 100 --json number)
          ESCALATED=$(gh issue list --label factory --label reconciler-escalated \
                        --state open --limit 100 --json number)
          # unique_by: an item carrying two of these labels is one stopped item.
          STOPPED=$(printf '%s\n%s\n%s\n%s' "$BLOCKED" "$DISPUTED" "$SPEC_DISPUTED" "$ESCALATED" \
                      | jq -s 'add | unique_by(.number) | length')

          echo "Stopped factory items: $STOPPED (ceiling $MAX_BLOCKED)."

          if [ "$STOPPED" -ge "$MAX_BLOCKED" ]; then
            echo "::warning::$STOPPED factory item(s) are stopped and waiting on a human, at or above the ceiling of $MAX_BLOCKED. Admitting nothing this poll — answer or resume some of the queue first. Nothing is lost: ready items stay ready in Notion and are picked up by the next poll after the queue drains."
            echo "admit=false" >> "$GITHUB_OUTPUT"
          else
            echo "admit=true" >> "$GITHUB_OUTPUT"
          fi

      # `set -euo pipefail` above means a gh or jq failure fails this job rather
      # than reaching here with an empty answer. That is deliberate: admitting
      # work while blind to the queue depth is the exact behaviour the gate
      # exists to prevent, so it fails closed and noisily.
      - name: Poll Notion for ready items
        if: steps.gate.outputs.admit == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Two per hourly poll, not the script's default of one. A ten-item
          # queue at one per poll is ten hours with no slack, so a single
          # delayed or skipped run means the queue is not drained by morning.
          # Deliberately not higher: every started item ends in a PR a human
          # still has to review, and the cap is what stops the factory
          # outrunning that.
          FACTORY_MAX_PER_RUN: "2"
        run: node scripts/factory/poll-notion.mjs
