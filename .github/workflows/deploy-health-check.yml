name: Deploy Health Check

# A smoke test on a factory preview. It gates NOTHING.
#
# It used to carry a `promote-to-production` job that ran
# `vercel alias set "$DEPLOYMENT_URL" motko.app`, and two triggers that fed it
# a URL. Both triggers were incapable of producing one, so that job never ran
# once — and the day it did would have been the bad day, because the URL it
# would have aliased to motko.app is a FACTORY BRANCH preview. A green health
# check would have promoted unreviewed, unmerged code to production.
#
# What each trigger did:
#
#   push: main       Removed earlier. The lookup polled
#                    `deployments?environment=Preview` for the main SHA, and
#                    Preview deployments belong to factory branches, so there
#                    was never a matching object. Reported `last status: none`
#                    on every attempt — zero deployments, not one still
#                    building. No timeout would have helped.
#
#   workflow_run     Removed by #462, for the same reason. "Factory — Deploy to
#                    Preview" runs on an issue being labelled and resolves
#                    `heads/factory/<issue>`; this workflow then resolved
#                    `heads/main` and asked for a Preview deployment on it. Same
#                    impossible query, one trigger later. It read as intermittent
#                    only because most labellings are not `previewed`, so the
#                    deploy run concluded `skipped` and this one skipped with it.
#                    On every genuine preview it ran, and on every genuine
#                    preview it failed.
#
# So the URL is now always supplied by the caller, and the lookup is gone
# altogether. "Factory — Deploy to Preview" dispatches this with the preview URL
# it has already resolved for the factory branch — the URL it puts in its own
# "Ready for review" comment. That is the deployment a human is about to look
# at, and checking it is the whole remaining value here.
#
# Production is promoted by Vercel on merge to main, as CLAUDE.md records. If
# you want a gate in front of THAT, it needs whatever Vercel registers for the
# production branch, and it is a new capability rather than a repair — give it
# its own ticket. Do not reach for this workflow: everything it can see belongs
# to a branch that has not been merged.
on:
  # The only trigger. Dispatched by "Factory — Deploy to Preview" once it has a
  # preview URL, and by a human for an emergency override.
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Preview deployment URL to check'
        required: true
        type: string
      issue_number:
        description: 'Factory issue number (optional, for notifications)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number (optional, for notifications)'
        required: false
        type: string

# Serialize health checks so two previews cannot interleave their runs against
# the same shared test account.
concurrency:
  group: preview-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Run health checks
    runs-on: ubuntu-latest
    # 3 minutes is the acceptance criterion from #195 ("workflow completes
    # within 3 minutes") and is enforced by tests/acceptance/195.test.ts, so it
    # stays. The deployment wait loop below MUST fit inside it — see the
    # comment there. It did not: the loop polled for 10 minutes inside this
    # 3-minute job, so the runner killed the job mid-wait every time (30
    # consecutive cancelled runs, zero promotions, 18–21 Aug 2026). A cancelled
    # job is not a failed one, so promote-to-production was skipped in silence
    # rather than going red — which is how it stayed hidden for four days.
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
      deployments: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No lookup. The caller resolved the preview URL against the factory
      # branch and passes it in; this workflow has no way to find it on its own
      # and every past attempt to give it one asked the wrong ref. Required by
      # `on.workflow_dispatch.inputs`, so an empty value means the caller
      # computed nothing — fail loudly rather than health-check the empty
      # string, which is how a blank URL reached the failure alert before.
      - name: Take the deployment URL from the caller
        id: get_deployment
        env:
          MANUAL_URL: ${{ inputs.deployment_url }}
        run: |
          if [ -z "$MANUAL_URL" ]; then
            echo "::error::No deployment_url was supplied. The caller resolves the preview URL; this workflow does not look one up."
            exit 1
          fi
          echo "url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
          echo "Checking $MANUAL_URL"

      - name: Run health check script
        id: health_check
        env:
          DEPLOYMENT_URL: ${{ steps.get_deployment.outputs.url }}
          CONFIG_FILE: deploy-health-check.json
          TEST_ACCOUNT_EMAIL: ${{ secrets.HEALTH_CHECK_TEST_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.HEALTH_CHECK_TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          .github/scripts/health-check.sh

      - name: Alert on health check failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT_URL: ${{ steps.get_deployment.outputs.url }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "::error::Health check failed for deployment $DEPLOYMENT_URL"

          # Comment on issue if issue number provided
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ **Health check failed**

          Deployment URL: $DEPLOYMENT_URL

          The health check failed for this deployment. The deployment will not be promoted to production.

          Review the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          To override and promote manually, see the procedures in FACTORY.md."
          fi

          # Comment on PR if PR number provided
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ Health check failed for preview deployment. See [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi

      - name: Fail the job if health check failed
        if: failure()
        run: |
          echo "::error::Health check failed - blocking production promotion"
          exit 1
