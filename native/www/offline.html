<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Motko - No Connection</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #004225;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 32px;
        text-align: center;
      }
      .logo {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 48px;
      }
      .message {
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 12px;
        opacity: 0.9;
      }
      .detail {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 48px;
        opacity: 0.7;
      }
      .retry-button {
        background: #ffffff;
        color: #004225;
        border: none;
        border-radius: 8px;
        padding: 16px 32px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.2s;
      }
      .retry-button:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">Motko</div>
      <div class="message">No internet connection</div>
      <div class="detail">
        Please check your network connection and try again.
      </div>
      <button class="retry-button" onclick="retryLoad()">Try again</button>
    </div>
    <script>
      function retryLoad() {
        window.location.reload();
      }
    </script>
  </body>
</html>
